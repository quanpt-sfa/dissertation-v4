schemas:
  json_object:
    contract_type: json_object
    version: 1
    required_keys: []
    additional_properties: true
    compatibility_policy: strict
  json_array:
    contract_type: json_array
    version: 1
    item_type: object
    compatibility_policy: strict
  text_value:
    contract_type: text
    version: 1
    min_length: 1
    compatibility_policy: strict
  markdown_document:
    contract_type: markdown
    version: 1
    required_prefix: '#'
    compatibility_policy: strict
  registry_lock_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - metadata
    - artifacts
    - schemas
    - steps
    - tests
    - appendix_b
    - decisions
    - access_matrix
    - decision_traceability
    - compiler_version
