schemas:
  json_object:
    contract_type: json_object
    version: 1
    required_keys: []
    additional_properties: true
    compatibility_policy: strict
  json_array:
    contract_type: json_array
    version: 1
    item_type: object
    compatibility_policy: strict
  text_value:
    contract_type: text
    version: 1
    min_length: 1
    compatibility_policy: strict
  markdown_document:
    contract_type: markdown
    version: 1
    required_prefix: '#'
    compatibility_policy: strict
  registry_lock_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - metadata
    - artifacts
    - schemas
    - steps
    - tests
    - appendix_b
    - decisions
    - access_matrix
    - decision_traceability
    - compiler_version
  protocol_hash_schema:
    contract_type: text
    version: 1
    min_length: 64
  source_config_manifest_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - source_hashes
    - source_code_hashes
    - generated_document_hashes
    - compiler_version
    - python_version
    - git_commit
    - git_dirty
    - git_diff_hash
    - untracked_hashes
    - package_lock
    - environment_observation
  capability_seed_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - l3
    - strict_channel_holdout
    - observed_verification
  decision_traceability_schema:
    contract_type: json_array
    version: 1
    item_type: object
  artifact_catalog_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - registry_lock
    - success_receipt
    - sealed_outcome_store
    - development_oof_predictions
    - raw_outer_predictions
  schema_catalog_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - model_freeze_receipt_schema
    - sealed_outcome_frame
    - development_oof_predictions_frame
    - raw_outer_predictions_frame
  step_catalog_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - P00
    - P10
    - P11
    - P12
    - P15
    - P16
    - P17
  access_matrix_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - P00
    - P10
    - P11
    - P12
    - P15
    - P16
    - P17
  seal_receipt_schema:
    contract_type: receipt
    version: 1
    required_keys:
    - status
    - protocol_hash
    - opens_at_step
  environment_expectation_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - python
    - reproducibility_mode
    - rng_policy
  environment_observation_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - compiler_version
    - hash_algorithm
    - python_version
    - platform
    - machine
    - processor
    - uv_lock_hash
    - packages
    - thread_environment
  p00_audit_markdown:
    contract_type: markdown
    version: 1
    required_prefix: '# P00 audit report'
  job_manifest_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - run_id
    - protocol_hash
    - output_hashes
  success_receipt_schema:
    contract_type: receipt
    version: 1
    required_keys:
    - status
    - protocol_hash
    - manifest_hash
  model_freeze_receipt_schema:
    contract_type: receipt
    version: 1
    required_keys:
    - status
    - protocol_hash
    - split_registry_hash
    - measurement_selection_hash
    - feature_registry_hash
    - preprocessing_hash
    - model_settings_hash
    - model_artifact_hash
    - development_oof_hash
    - raw_outer_predictions_hash
    - calibration_plan_hash
    - git_commit
    - environment_hash
  outer_open_receipt_schema:
    contract_type: receipt
    version: 1
    required_keys:
    - status
    - protocol_hash
    - model_freeze_receipt_hash
    - opened_at_state
  gate_receipt_schema:
    contract_type: receipt
    version: 1
    required_keys:
    - status
    - protocol_hash
    - gate_id
    - verdict
  firm_master_frame:
    contract_type: dataframe
    version: 1
    columns:
    - column: firm_id
      dtype: string
      nullable: false
    primary_key:
    - firm_id
    uniqueness_constraints:
    - - firm_id
    row_checks: []
    cross_column_checks: []
    strict_columns: true
    coerce: false
    compatibility_policy: strict
  firm_year_panel_frame:
    contract_type: dataframe
    version: 1
    columns:
    - column: firm_id
      dtype: string
      nullable: false
    - column: fiscal_year
      dtype: int16
      nullable: false
    - column: prediction_time
      dtype: datetime64[ns]
      nullable: false
    primary_key:
    - firm_id
    - fiscal_year
    uniqueness_constraints:
    - - firm_id
      - fiscal_year
    row_checks:
    - column: fiscal_year
      check: between
      min: 1990
      max: 2100
    cross_column_checks: []
    strict_columns: true
    coerce: false
    compatibility_policy: strict
  evidence_ledger_frame:
    contract_type: dataframe
    version: 1
    columns:
    - column: firm_id
      dtype: string
      nullable: false
    - column: fiscal_year
      dtype: int16
      nullable: false
    - column: source_id
      dtype: string
      nullable: false
    - column: channel_id
      dtype: string
      nullable: false
    - column: availability_date
      dtype: datetime64[ns]
      nullable: false
    - column: outcome
      dtype: bool
      nullable: true
    primary_key:
    - firm_id
    - fiscal_year
    - source_id
    uniqueness_constraints:
    - - firm_id
      - fiscal_year
      - source_id
    row_checks: []
    cross_column_checks: []
    strict_columns: true
    coerce: false
    compatibility_policy: strict
  risk_sets_frame:
    contract_type: dataframe
    version: 1
    columns:
    - column: firm_id
      dtype: string
      nullable: false
    - column: fiscal_year
      dtype: int16
      nullable: false
    - column: prediction_time
      dtype: datetime64[ns]
      nullable: false
    - column: eligible
      dtype: bool
      nullable: false
    - column: mature
      dtype: bool
      nullable: false
    primary_key:
    - firm_id
    - fiscal_year
    uniqueness_constraints:
    - - firm_id
      - fiscal_year
    row_checks: []
    cross_column_checks: []
    strict_columns: true
    coerce: false
    compatibility_policy: strict
  l0_l1_inputs_frame:
    contract_type: dataframe
    version: 1
    columns:
    - column: firm_id
      dtype: string
      nullable: false
    - column: fiscal_year
      dtype: int16
      nullable: false
    - column: target_id
      dtype: string
      nullable: false
    - column: outcome
      dtype: bool
      nullable: true
    primary_key:
    - firm_id
    - fiscal_year
    - target_id
    uniqueness_constraints:
    - - firm_id
      - fiscal_year
      - target_id
    row_checks: []
    cross_column_checks: []
    strict_columns: true
    coerce: false
    compatibility_policy: strict
  sealed_outcome_frame:
    contract_type: dataframe
    version: 1
    columns:
    - column: firm_id
      dtype: string
      nullable: false
    - column: fiscal_year
      dtype: int16
      nullable: false
    - column: outcome
      dtype: bool
      nullable: false
    primary_key:
    - firm_id
    - fiscal_year
    uniqueness_constraints:
    - - firm_id
      - fiscal_year
    row_checks: []
    cross_column_checks: []
    strict_columns: true
    coerce: false
    compatibility_policy: strict
  feature_panel_frame:
    contract_type: dataframe
    version: 1
    columns:
    - column: firm_id
      dtype: string
      nullable: false
    - column: fiscal_year
      dtype: int16
      nullable: false
    primary_key:
    - firm_id
    - fiscal_year
    uniqueness_constraints:
    - - firm_id
      - fiscal_year
    row_checks: []
    cross_column_checks: []
    strict_columns: false
    coerce: false
    compatibility_policy: strict
  fold_weights_frame:
    contract_type: dataframe
    version: 1
    columns:
    - column: firm_id
      dtype: string
      nullable: false
    - column: fiscal_year
      dtype: int16
      nullable: false
    - column: outer_fold
      dtype: string
      nullable: false
    - column: weight
      dtype: float64
      nullable: false
    primary_key:
    - firm_id
    - fiscal_year
    - outer_fold
    uniqueness_constraints:
    - - firm_id
      - fiscal_year
      - outer_fold
    row_checks:
    - column: weight
      check: greater_than
      min: 0.0
    cross_column_checks: []
    strict_columns: true
    coerce: false
    compatibility_policy: strict
  development_oof_predictions_frame:
    contract_type: dataframe
    version: 1
    columns:
    - column: firm_id
      dtype: string
      nullable: false
    - column: fiscal_year
      dtype: int16
      nullable: false
    - column: outer_fold
      dtype: string
      nullable: false
    - column: learner_id
      dtype: string
      nullable: false
    - column: measurement_id
      dtype: string
      nullable: false
    - column: target_id
      dtype: string
      nullable: false
    - column: prediction
      dtype: float64
      nullable: false
    primary_key:
    - firm_id
    - fiscal_year
    - outer_fold
    - learner_id
    - measurement_id
    - target_id
    uniqueness_constraints:
    - - firm_id
      - fiscal_year
      - outer_fold
      - learner_id
      - measurement_id
      - target_id
    row_checks:
    - column: prediction
      check: between
      min: 0.0
      max: 1.0
    cross_column_checks: []
    strict_columns: true
    coerce: false
    compatibility_policy: strict
  raw_outer_predictions_frame:
    contract_type: dataframe
    version: 1
    columns:
    - column: firm_id
      dtype: string
      nullable: false
    - column: fiscal_year
      dtype: int16
      nullable: false
    - column: outer_fold
      dtype: string
      nullable: false
    - column: learner_id
      dtype: string
      nullable: false
    - column: measurement_id
      dtype: string
      nullable: false
    - column: target_id
      dtype: string
      nullable: false
    - column: prediction
      dtype: float64
      nullable: false
    primary_key:
    - firm_id
    - fiscal_year
    - outer_fold
    - learner_id
    - measurement_id
    - target_id
    uniqueness_constraints:
    - - firm_id
      - fiscal_year
      - outer_fold
      - learner_id
      - measurement_id
      - target_id
    row_checks:
    - column: prediction
      check: between
      min: 0.0
      max: 1.0
    cross_column_checks: []
    strict_columns: true
    coerce: false
    compatibility_policy: strict
  simulation_batch_frame:
    contract_type: dataframe
    version: 1
    columns:
    - column: scenario_id
      dtype: string
      nullable: false
    - column: method_id
      dtype: string
      nullable: false
    - column: replication_id
      dtype: int64
      nullable: false
    - column: metric_id
      dtype: string
      nullable: false
    - column: estimate
      dtype: float64
      nullable: false
    - column: mcse
      dtype: float64
      nullable: true
    primary_key:
    - scenario_id
    - method_id
    - replication_id
    - metric_id
    uniqueness_constraints:
    - - scenario_id
      - method_id
      - replication_id
      - metric_id
    row_checks:
    - column: mcse
      check: greater_than_or_equal
      min: 0.0
    cross_column_checks: []
    strict_columns: true
    coerce: false
    compatibility_policy: strict
  raw_audit_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - run_id
    - source_id
    - protocol_hash
    - audited_at_utc
    - status
    - source_metadata
    - file_signature
    - schema_audit
    - duplicate_key_audit
    - date_audit
    - unit_audit
    - coverage
    - issues
    - decision
    additional_properties: false
    compatibility_policy: strict
  p02_resolution_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - run_id
    - protocol_hash
    - entity_resolution
    - duplicate_groups
    - excluded_rows
    - excluded_firm_years
    - summary
    additional_properties: false
    compatibility_policy: strict
