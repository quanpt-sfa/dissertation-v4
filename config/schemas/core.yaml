    - sealed_outcome_frame
    - development_oof_predictions_frame
    - raw_outer_predictions_frame
  step_catalog_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - P00
    - P10
    - P11
    - P12
    - P15
    - P16
    - P17
  access_matrix_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - P00
    - P10
    - P11
    - P12
    - P15
    - P16
    - P17
