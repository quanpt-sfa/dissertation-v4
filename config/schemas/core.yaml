    contract_type: text
    version: 1
    min_length: 64
  source_config_manifest_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - source_hashes
    - source_code_hashes
    - generated_document_hashes
    - compiler_version
    - python_version
    - git_commit
    - git_dirty
    - git_diff_hash
    - untracked_hashes
    - package_lock
    - environment_observation
  capability_seed_schema:
    contract_type: json_object
    version: 1
    required_keys:
    - l3
    - strict_channel_holdout
    - observed_verification
  decision_traceability_schema:
    contract_type: json_array
    version: 1
    item_type: object
  artifact_catalog_schema:
