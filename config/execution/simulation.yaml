simulation:
  operational_scenarios:
    - scenario_id: empirical_baseline_L1_CONTENT_STRICT
      tier: semi_synthetic_development_covariates
      sample_design: p02_development_panel
      calibration_target_id: L1_ANNUAL
      semi_synthetic_feature_ids:
        - fs_aud_accounts_receivable
      anchor_sensitivity: 0.85
      anchor_false_positive: 0.001
      weak_sensitivity: 0.60
      weak_false_positive: 0.002
      content_signal: 1.0
      anchor_verification_probability: 0.70
      weak_verification_probability: 0.45
      selective_verification_strength: 0.20
      channel_dependence: 0.10
      horizon_days: 365
      detection_delay_mean_days: 120
      shift_strength: 0.0
      signal_structure: linear
      latent_risk_strength: 1.0
  imports_production_labels: true
  objective:
    targets:
    - L1
    - L2
    - L3
    selective_verification: true
    gates:
    - 1
    - 2
    - 3
    utility: true
    ground_truth_known: true
    estimate_vietnam_prevalence: false
  tiers:
  - fully_synthetic
  - semi_synthetic_development_covariates
  outer_outcomes_allowed: false
  known_cases_allowed: false
  dgp:
  - Y_star
  - verification_or_observability
  - sources
  - channel_dependence
  - delay
  - shift
  - sample_size
  - signal_structure
  l3_correct_and_misspecified_checked: true
  scenario_space:
  - prevalence
  - Se
  - Sp
  - dependence
  - verification
  - delay
  - shift
  - sample_size
  - signal_structure
  scenario_design: baseline_plus_locked_stress_blocks

  active_profile: core

  execution_profiles:
    core:
      description: Confirmatory dissertation analysis used for the dissertation's main claims.
      analysis_role: confirmatory
      role_priority: 0
      include_standalone_estimators: true
      blocks:
        - learners:
            - logistic_regression
            - linear_svm
            - random_forest
            - xgboost
            - multilayer_perceptron
          strategies:
            - naive_observed_as_negative
            - verified_only
            - ipw
            - pu
          training_cost_regimes:
            - symmetric
          imbalance_treatments:
            - none

    cost_sensitive_robustness:
      description: Prespecified robustness for asymmetric training loss.
      analysis_role: robustness_cost_sensitive
      role_priority: 10
      include_standalone_estimators: false
      blocks:
        - learners:
            - logistic_regression
            - random_forest
            - xgboost
          strategies:
            - naive_observed_as_negative
            - ipw
            - pu
          training_cost_regimes:
            - moderate_fn
            - high_fn
          imbalance_treatments:
            - none

    methodological_robustness:
      description: Prespecified robustness for regularized linear, single tree, and default boosting families.
      analysis_role: robustness_methodological
      role_priority: 15
      include_standalone_estimators: false
      blocks:
        - learners:
            - elastic_net_logistic
            - decision_tree
            - main_boosting
          strategies:
            - naive_observed_as_negative
            - pu
          training_cost_regimes:
            - symmetric
          imbalance_treatments:
            - none

    algorithmic_robustness:
      description: Prespecified breadth across non-core learner families.
      analysis_role: robustness_algorithmic
      role_priority: 20
      include_standalone_estimators: false
      blocks:
        - learners:
            - rbf_svm
            - k_nearest_neighbors
            - gaussian_naive_bayes
            - adaboost
            - extra_trees
            - lightgbm
            - catboost
          strategies:
            - naive_observed_as_negative
            - pu
          training_cost_regimes:
            - symmetric
          imbalance_treatments:
            - none

    imbalance_treatment_robustness:
      description: Prespecified robustness for synthetic minority oversampling.
      analysis_role: robustness_imbalance_treatment
      role_priority: 30
      include_standalone_estimators: false
      blocks:
        - learners:
            - logistic_regression
            - random_forest
            - xgboost
          strategies:
            - naive_observed_as_negative
            - verified_only
          training_cost_regimes:
            - symmetric
          imbalance_treatments:
            - smote
            - adasyn

    prespecified_all:
      description: Union of confirmatory and all prespecified robustness blocks.
      analysis_role: prespecified_union
      role_priority: 90
      union_profiles:
        - core
        - cost_sensitive_robustness
        - methodological_robustness
        - algorithmic_robustness
        - imbalance_treatment_robustness

    full:
      description: Full available library for future or explicitly exploratory work.
      analysis_role: exploratory_full_benchmark
      role_priority: 100
      include_all_registered_methods: true

  targets:
    - L0
    - L1
    - L2
    - L3_fixed_pi
    - L3_hierarchical_pi

  learners:
    - logistic_regression
    - elastic_net_logistic
    - decision_tree
    - random_forest
    - main_boosting
    - linear_svm
    - rbf_svm
    - k_nearest_neighbors
    - gaussian_naive_bayes
    - adaboost
    - extra_trees
    - xgboost
    - lightgbm
    - catboost
    - multilayer_perceptron

  methods:
    - naive_observed_as_negative
    - verified_only
    - ipw
    - pu
    - latent_bayesian
    - partial_identification

  full_cartesian_product: false
  matrix_design:
    confirmatory_vietnamese_learners:
      - logistic_regression
      - linear_svm
      - random_forest
      - xgboost
      - multilayer_perceptron

  oracle_role: upper_benchmark_only
  sensitivities:
  - noisy_positive_pu
  - misspecified_l3
  metrics:
    fixed_pi:
    - ranking_recovery
    - misspecification_regret
    - measurement_selection_stability
    hierarchical_pi:
    - pi_bias
    - pi_rmse
    - pi_coverage
    source_accuracy_bias_only_when_estimated: true
    other:
    - transfer
    - gate_operating_characteristics
    - utility_regret
    - actual_mcse
  core:
    minimum_replications: 2500
    pass_fail_mcse_max: 0.01
    batch_size: 250
    maximum_replications: 10000
  l3:
    initial_replications: 1000
    pass_fail_mcse_max: 0.02
    batch_size: 100
    maximum_replications: 5000
  continuous_metrics:
    mcse_fraction_of_minimum_meaningful_improvement_max: 0.1
  adaptive_replication:
    enabled: true
  anchor_false_positive_grid:
  - 0.0
  - 0.01
  - 0.03
  - 0.05
  protocol_role:
    must_complete_before_outer_test: true
    allowed_post_simulation_changes:
    - method_demotion
    - logged_method_error_fix
    gate_optimization_on_outer_performance_forbidden: true

  cost_sensitive:
    enabled: true
    cost_neutral_regime_id: symmetric
    primary_evaluation_cost_regime_id: high_fn
    primary_review_budget_id: top_05pct
    threshold_validation_fraction: 0.25
    maximum_cost_weight: 100.0
    cost_mcse_relative_fraction: 0.02

    core_training_regimes: [symmetric, moderate_fn, high_fn]
    extended_training_regimes: [symmetric, high_fn]
    evaluation_regimes: [symmetric, moderate_fn, high_fn, extreme_fn]

    cost_regimes:
      - cost_regime_id: symmetric
        false_positive_cost: 1.0
        false_negative_cost: 1.0
        review_cost: 0.0
        true_positive_benefit: 0.0
        role: cost_neutral_baseline
      - cost_regime_id: moderate_fn
        false_positive_cost: 1.0
        false_negative_cost: 5.0
        review_cost: 0.10
        true_positive_benefit: 0.0
        role: moderate_false_negative_penalty
      - cost_regime_id: high_fn
        false_positive_cost: 1.0
        false_negative_cost: 20.0
        review_cost: 0.10
        true_positive_benefit: 0.0
        role: high_false_negative_penalty
      - cost_regime_id: extreme_fn
        false_positive_cost: 1.0
        false_negative_cost: 50.0
        review_cost: 0.10
        true_positive_benefit: 0.0
        role: extreme_false_negative_stress

    review_budgets:
      - review_budget_id: top_01pct
        fraction: 0.01
      - review_budget_id: top_05pct
        fraction: 0.05
      - review_budget_id: top_10pct
        fraction: 0.10

  empirical_calibration:
    enabled: true
    population_artifact: firm_year_panel
    covariate_artifact: feature_panel
    label_artifact: source_channel_matrices
    sample_design: p02_development_panel
    empirical_row_mode: exact_rows_no_bootstrap
    prevalence_calibration: match_P05_observed_positive_rate_through_locked_DGP
    incompatible_detection_model: fail_closed
    calibration_target_must_be_explicit: true
    calibration_repeats: 32

  imbalance_treatment:
    enabled: true
    treatments: [none, smote, adasyn]
    neutral_treatment_id: none
    robustness_treatments: [smote, adasyn]
    learners:
      - logistic_regression
      - random_forest
      - xgboost
    strategies:
      - naive_observed_as_negative
      - verified_only
    training_cost_regime_id: symmetric
    maximum_neighbors: 5

  cost_sensitive_replication:
    minimum_replications: 500
    pass_fail_mcse_max: 0.02
    batch_size: 50
    maximum_replications: 2000

  extended_replication:
    minimum_replications: 250
    pass_fail_mcse_max: 0.02
    batch_size: 50
    maximum_replications: 1000
