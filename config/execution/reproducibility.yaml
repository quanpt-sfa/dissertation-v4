reproducibility:
  hash_algorithm: sha256
  shared_ledger_append: forbidden
  output_root_template: artifacts/runs/{run_id}
  recovery_policy: quarantine_incomplete
  package_lock_file: uv.lock
  require_clean_tree_for_acceptance: true
  environment_expectations:
    python: '>=3.11'
    reproducibility_mode: strict
    rng_policy: explicit_seed
    numpy_generator_policy: default_rng_only
    thread_policy: record_and_lock
    container_policy: record_digest_or_explicit_absence
  seed_offsets:
    nested_channel: 100003
    tuning_candidate: 1009
