reproducibility:
  hash_algorithm: sha256
  shared_ledger_append: forbidden
  output_root_template: artifacts/runs/{run_id}
  recovery_policy: quarantine_incomplete
  environment_expectations:
    python: ">=3.11"
    package_lock_file: pyproject.toml
    container_policy: recorded_when_available
    os_base_image: recorded
    blas_policy: recorded
    cpu_gpu_policy: cpu_or_gpu_recorded
    cpu_architecture: recorded
    thread_policy: configured
    rng_policy: explicit_seed
    numpy_generator_policy: default_rng_only
    learner_determinism: configured
    xgboost: {threads: configured, tree_method: configured}
    pymc: {chains: configured, cores: configured, seed: configured}
    reproducibility_mode: strict
