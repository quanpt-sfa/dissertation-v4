simulation_mcse:
  contract_version: 1
  require_complete_policy_coverage: true
  allowed_roles:
  - confirmatory
  - diagnostic
  - descriptive
  allowed_undefined_policies:
  - forbid
  - allow_nonblocking
  - report_only
  allowed_target_rules:
  - absolute
  - relative_to_mean
  - mmi_scaled
  - none
  policies:
  - policy_id: confirmatory_fit_success
    priority: 120
    metric_pattern: fit_success
    role: confirmatory
    mcse_gate_required: true
    undefined_policy: forbid
    target_rule: absolute
    minimum_finite_fraction: 1.0
  - policy_id: confirmatory_fixed_pi_fit_success
    priority: 120
    metric_pattern: fixed_pi_fit_success
    role: confirmatory
    mcse_gate_required: true
    undefined_policy: forbid
    target_rule: absolute
    minimum_finite_fraction: 1.0
  - policy_id: confirmatory_threshold_selection
    priority: 120
    metric_pattern: threshold_selection_success
    role: confirmatory
    mcse_gate_required: true
    undefined_policy: forbid
    target_rule: absolute
    minimum_finite_fraction: 1.0
  - policy_id: confirmatory_fixed_pi_row_brier
    priority: 120
    metric_pattern: row_brier
    role: confirmatory
    mcse_gate_required: true
    undefined_policy: forbid
    target_rule: absolute
    minimum_finite_fraction: 1.0
  - policy_id: confirmatory_fixed_pi_row_log_loss
    priority: 120
    metric_pattern: row_log_loss
    role: confirmatory
    mcse_gate_required: true
    undefined_policy: forbid
    target_rule: absolute
    minimum_finite_fraction: 1.0
  - policy_id: confirmatory_fixed_pi_calibration_bias
    priority: 120
    metric_pattern: row_calibration_bias
    role: confirmatory
    mcse_gate_required: true
    undefined_policy: forbid
    target_rule: absolute
    minimum_finite_fraction: 1.0
  - policy_id: confirmatory_paired_brier_regret
    priority: 120
    metric_pattern: paired_brier_regret
    role: confirmatory
    mcse_gate_required: true
    undefined_policy: forbid
    target_rule: absolute
    minimum_finite_fraction: 1.0
  - policy_id: confirmatory_variance_reduction
    priority: 110
    metric_pattern: variance_reduction_vs_*
    role: confirmatory
    mcse_gate_required: true
    undefined_policy: forbid
    target_rule: absolute
    minimum_finite_fraction: 1.0
  - policy_id: confirmatory_review_sample_ratio
    priority: 110
    metric_pattern: review_sample_size_ratio_vs_*
    role: confirmatory
    mcse_gate_required: true
    undefined_policy: forbid
    target_rule: absolute
    minimum_finite_fraction: 1.0
  - policy_id: diagnostic_latent_ap
    priority: 100
    metric_pattern: latent_average_precision
    role: diagnostic
    mcse_gate_required: false
    undefined_policy: allow_nonblocking
    target_rule: none
    minimum_finite_fraction: 0.0
