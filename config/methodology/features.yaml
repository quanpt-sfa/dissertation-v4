features:
  feature_panel:
    # Feature values are computed directly from the registered raw source at P07
    # (src/features/compute.py); there is no pre-computed feature store. This block
    # keeps only the feature-panel methodology contracts.
    allowed_fiscal_year_min: 2015
    allowed_fiscal_year_max: 2025
    availability_policy: synthetic_annual_anchor_explicit_assumption
    availability_contract:
      observed_publication_dates_available: false
      primary_synthetic_anchor_month_day: 03-31
      sensitivity_synthetic_anchor_month_days:
      - 06-30
      - 09-30
      limitation_disclosure_required: true
    revision_contract:
      point_in_time_vintages_available: false
      revision_policy_source: extract_provenance.revision_policy
      restatement_sensitivity_required: true
    preprocessing:
      winsorization: none
      p1_p99_role: diagnostics_only
      train_fold_only_if_enabled: true
    canonical_key:
    - firm_master_id
    - fiscal_year
  label_model_allows_content: false
  label_model_allowed_blocks:
  - S
  - M
  - T
  - Q
  - Z_M
  registry:
  - feature_id: fs_aud_accounts_receivable
    canonical_name: fs_aud_accounts_receivable
    display_name: Audited accounts receivable
    description: Standardized accounts_receivable from the audited annual financial statement.
    theoretical_block: accounting_content
    source_dataset: financial_statement_full_long
    source_table_or_file: values/atomic/fs_aud_accounts_receivable.csv.gz
    source_column_or_columns:
    - issuer_ticker
    - fiscal_year
    - audit_status
    - scope
    - source_item_id
    - value_numeric
    - annual_anchor_date
    physical_column: fs_aud_accounts_receivable
    feature_file: values/atomic/fs_aud_accounts_receivable.csv.gz
    value_column: value_numeric
    formula: balance_sheet__3_cac_khoan_phai_thu_ngan_han + balance_sheet__1_phai_thu_dai_han
    dependencies:
    - raw:balance_sheet__3_cac_khoan_phai_thu_ngan_han
    - raw:balance_sheet__1_phai_thu_dai_han
    unit: VND
    sign_convention: source_reported
    fiscal_period_reference: fiscal_year_t
    lag_structure: contemporaneous_at_annual_anchor
    availability_rule: available_at_or_before_prediction_time_under_locked_annual_rule
    availability_date_field: available_date
    availability_basis_allowed:
    - synthetic_annual_anchor
    temporal_role: annual_measurement_at_anchor
    maximum_information_date: 31_march_fiscal_year_plus_one
    expected_dtype: float64
    allowed_missingness: allowed_with_explicit_missingness
    missingness_interpretation: coverage_or_dependency_missing_not_zero
    content_observability_role: content
    target_component_flag: false
    target_component_relation: none
    source_specific_flag: false
    source_channel: S1
    model_eligibility: eligible
    allowed_in_label_model: false
    confirmatory_status: confirmatory
    research_decision_status: LOCKED
    review_status: LOCKED
    availability_reason_code: SYNTHETIC_ANNUAL_ANCHOR
    denominator_rule: not_applicable
    valid_range: unbounded
    version: 1
    lineage:
    - source_column: value_numeric
      source_item_id: balance_sheet__3_cac_khoan_phai_thu_ngan_han
      transformation_step: component_sum
      transformation_order: 1
      formula_or_operation: balance_sheet__3_cac_khoan_phai_thu_ngan_han + balance_sheet__1_phai_thu_dai_han
      temporal_shift: t
      aggregation_rule: sum_registered_components
      join_keys: firm_master_id,fiscal_year
      join_cardinality: one_to_one_after_component_selection
      availability_constraint: all component available_date <= prediction_time
    - source_column: value_numeric
      source_item_id: balance_sheet__1_phai_thu_dai_han
      transformation_step: component_sum
      transformation_order: 2
