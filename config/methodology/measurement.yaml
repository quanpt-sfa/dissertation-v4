measurement:
  primary_target_id: null
  candidate_targets:
    L1_ANNUAL:
      sources: [S1_profit_adjustment, S1_revenue_adjustment, S2_audit_opinion]
    S3_BROAD:
      sources: [S3_BROAD]
    S3_REPORTING:
      sources: [S3_REPORTING]
    S3_CONTENT:
      sources: [S3_CONTENT]
    S3_TIMELINESS:
      sources: [S3_TIMELINESS]
    L1_REPORTING:
      sources: [S1_profit_adjustment, S1_revenue_adjustment, S2_audit_opinion, S3_REPORTING]
    L1_CONTENT_STRICT:
      sources: [S1_profit_adjustment, S1_revenue_adjustment, S3_CONTENT]
  roles:
    L0: single_source_benchmark
    L1: candidate_binary_aggregation
    L2: alternative_aggregation
    L3: measurement_sensitivity
  selection_candidates:
  - L2
  - L3_fixed_pi
  - none
  prior_accuracy_domain:
    lower_bound_source: high_confirmation_sources
    upper_bound_sources:
    - coverage
    - likelihood
    primary_prior: fixed_pi_grid
    hierarchical_prior_role: sensitivity_only
  objectives:
    L2:
    - soft_cross_entropy
    L3:
    - soft_cross_entropy
    - posterior_draws
    ranking_loss_role: robustness
  l3_model:
    primary: fixed_pi_latent_class
    source_specific_sensitivity_specificity: true
    channel_random_effect: true
    estimation: MCMC
    hierarchical_pi:
      role: sensitivity_only
      estimated_parameter_bias_only: true
    pairwise_dependence_role: sensitivity_only
    operational:
      fixed_pi_grid: []
      accuracy_priors_by_profile: {}
      pilot_max_rows: 2000
      mcmc:
        chains: 4
        warmup_per_chain: 500
        draws_per_chain: 1000
        alpha_proposal_sd: 0.15
        random_effect_proposal_sd: 0.15
        rhat_max: 1.05
        ess_min: 200
        posterior_predictive_source_rate_error_max: 0.10
        minimum_observations_per_source: 30
  fixed_pi:
    report_pi_bias: false
    report_pi_rmse: false
  strict_selection:
    design: nested_channel_within_time
    remove_heldout_channel_from:
    - target
    - label_model
    - features
    - tuning
    - calibration
    standard_holdout_role: secondary
  selection:
    time_only: M_f_star
    strict_channel: M_f_c_star
    development_only: true
    no_candidate_value: none
    stability_minimum_selected_folds: 3
    stability_denominator_folds: 4
  l2_missingness:
    normalize_over_observed_channels: true
    minimum_coverage_required: true
    minimum_observed_channels: null
    training_normalization: empirical_cdf_within_training_fold
    sensitivities:
    - mean
    - neutral
    - complete_channel_subset
  l2_scoring:
    formula: null
    supported_formula: quality_delay_weighted_observed_source_mean
    source_quality_by_profile: {}
    delay_half_life_days: null
    channel_weights: equal
