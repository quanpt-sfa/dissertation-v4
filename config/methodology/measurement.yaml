measurement:
  primary_target_id: L1_ANNUAL
  candidate_targets:
    L1_ANNUAL:
      sources:
      - S1_profit_adjustment
      - S1_revenue_adjustment
      - S2_audit_opinion
      analytical_role: primary_annual_measurement
    S3_BROAD:
      sources:
      - S3_BROAD
      analytical_role: descriptive_enforcement_boundary
      temporal_role: next_calendar_year_regulatory_event
    S3_REPORTING:
      sources:
      - S3_REPORTING
      analytical_role: enforcement_boundary
      temporal_role: next_calendar_year_regulatory_event
    S3_CONTENT:
      sources:
      - S3_CONTENT
      analytical_role: enforcement_boundary
      temporal_role: next_calendar_year_regulatory_event
    S3_TIMELINESS:
      sources:
      - S3_TIMELINESS
      analytical_role: enforcement_boundary
      temporal_role: next_calendar_year_regulatory_event
    L1_REPORTING:
      sources:
      - S1_profit_adjustment
      - S1_revenue_adjustment
      - S2_audit_opinion
      - S3_REPORTING
      analytical_role: legacy_composite_sensitivity_only
    L1_CONTENT_STRICT:
      sources:
      - S1_profit_adjustment
      - S1_revenue_adjustment
      - S3_CONTENT
      analytical_role: legacy_composite_sensitivity_only
  roles:
    L0: single_source_benchmark
    L1: candidate_binary_aggregation
    L2: alternative_aggregation
    L3: measurement_sensitivity
  execution_tracks:
    mode: sequential_capability_gated
    order:
    - L1_ANNUAL
    - L2
    - L3_fixed_pi
    primary_required: true
    optional_unavailable_policy: skip_track_not_pipeline
    outer_performance_selection_forbidden: true
    track_ids:
      L1_ANNUAL: track_l1
      L2: track_l2
      L3_fixed_pi: track_l3_fixed_pi
  selection_candidates:
  - L2
  - L3_fixed_pi
  - none
  prior_accuracy_domain:
    lower_bound_source: independently_justified_restrictions_only
    upper_bound_sources:
    - coverage
    - likelihood
    primary_prior: fixed_pi_grid
    hierarchical_prior_role: sensitivity_only
  identification:
    default_domain_type: sensitivity_region
    high_specificity_anchor_assumed: false
    enforcement_proxy_role: selectively_observed_positive_evidence
    independent_justification_required: true
    legacy_global_justification_flag_role: ignored_fail_closed
    identified_set_gate:
      require_registered_restriction: true
      require_independent_source: true
      require_target_population_transportability: true
      require_formal_approval: true
      require_numeric_value_for_numeric_bound: true
    evidence_basis_registry:
      kedia_rajgopal_2011:
        citation_key: kedia2011sec
        contribution: enforcement_selection_depends_on_regulatory_resources_and_proximity
        source_type: peer_reviewed_accounting_research
        independent_of_study_outcomes: true
        source_scope: us_sec_enforcement
        provides_numeric_bound_for_vietnam: false
      kubic_2021:
        citation_key: kubic2021examiners
        contribution: regulatory_review_does_not_observe_all_errors
        source_type: peer_reviewed_accounting_research
        independent_of_study_outcomes: true
        source_scope: us_sec_filing_review
        provides_numeric_bound_for_vietnam: false
      dyck_morse_zingales_2024:
        citation_key: dyck2024how
        contribution: detected_corporate_fraud_is_a_selected_subset_of_latent_occurrence
        source_type: peer_reviewed_accounting_research
        independent_of_study_outcomes: true
        source_scope: us_public_firms
        correction_checked: true
        provides_numeric_bound_for_vietnam: false
      hahn_murray_manolopoulou_2016:
        citation_key: hahn2016bayesian
        contribution: accounting_misconduct_prevalence_can_require_partial_identification
        source_type: peer_reviewed_statistical_accounting_method
        independent_of_study_outcomes: true
        source_scope: methodological
        provides_numeric_bound_for_vietnam: false
    restriction_registry:
      enforcement_false_positive_upper:
        parameter: P(S=1|Y*=0)
        restriction_type: numeric_upper_bound
        analytical_role: sensitivity_only
        source_ids:
        - kedia_rajgopal_2011
        - kubic_2021
        - dyck_morse_zingales_2024
        target_population: vietnam_listed_firm_year
        transportability_status: not_established
        approval_status: not_approved
        eligible_for_identified_set: false
        blocking_reasons:
        - no_external_numeric_bound_for_target_population
        - transportability_to_vietnam_not_established
      enforcement_sensitivity_lower:
        parameter: P(S=1|Y*=1)
        restriction_type: numeric_lower_bound
        analytical_role: sensitivity_only
        source_ids:
        - kubic_2021
        - dyck_morse_zingales_2024
        target_population: vietnam_listed_firm_year
        transportability_status: not_established
        approval_status: not_approved
        eligible_for_identified_set: false
        blocking_reasons:
        - no_external_numeric_bound_for_target_population
        - transportability_to_vietnam_not_established
      adjudication_specificity_lower:
        parameter: P(D=0|Y*=0,V=1)
        restriction_type: numeric_lower_bound
        analytical_role: sensitivity_only
        source_ids:
        - kedia_rajgopal_2011
        - kubic_2021
        target_population: vietnam_listed_firm_year
        transportability_status: not_established
        approval_status: not_approved
        eligible_for_identified_set: false
        blocking_reasons:
        - adjudication_error_rate_not_observed
        - transportability_to_vietnam_not_established
      verification_selection_ordering:
        parameter: P(V=1|Y*=1)>=P(V=1|Y*=0)
        restriction_type: shape_restriction
        analytical_role: sensitivity_only
        source_ids:
        - kedia_rajgopal_2011
        - dyck_morse_zingales_2024
        target_population: vietnam_listed_firm_year
        transportability_status: not_established
        approval_status: not_approved
        eligible_for_identified_set: false
        blocking_reasons:
        - direction_is_plausible_but_not_identified_in_target_population
    restrictions:
      enforcement_false_positive_upper: null
      enforcement_sensitivity_lower: null
      adjudication_specificity_lower: null
      verification_selection_ordering: null
    reporting:
      distinguish_identified_set_from_sensitivity_region: true
      distinguish_scenario_envelope: true
      prevalence_bound_status_required: true
      assumption_provenance_required: true
    robust_model_selection:
      paired_difference_dominance_primary: true
      separated_range_dominance_secondary: true
      model_selection_set_required: true
      minimax_regret_required: true
      scenario_fraction_rule_applies_to_identified_set: false
  objectives:
    L2:
    - soft_cross_entropy
    L3:
    - soft_cross_entropy
    - posterior_draws
    ranking_loss_role: robustness
  l3_model:
    primary: fixed_pi_latent_class
    source_specific_sensitivity_specificity: true
    channel_random_effect: true
    estimation: MCMC
    hierarchical_pi:
      role: sensitivity_only
      estimated_parameter_bias_only: true
    pairwise_dependence_role: sensitivity_only
    operational:
      parameter_status: PENDING_EXTERNAL_ELICITATION
      report_required: false
      unavailable_reason_code: L3_PARAMETERS_NOT_EXTERNALLY_JUSTIFIED
      fixed_pi_grid: []
      accuracy_priors_by_profile: {}
      pilot_max_rows: 2000
      mcmc:
        chains: 4
        warmup_per_chain: 500
        draws_per_chain: 1000
        alpha_proposal_sd: 0.15
        random_effect_proposal_sd: 0.15
        rhat_max: 1.05
        ess_min: 200
        posterior_predictive_source_rate_error_max: 0.1
        minimum_observations_per_source: 30
  fixed_pi:
    report_pi_bias: false
    report_pi_rmse: false
  strict_selection:
    design: nested_channel_within_time
    remove_heldout_channel_from:
    - target
    - label_model
    - features
    - tuning
    - calibration
    standard_holdout_role: secondary
  selection:
    time_only: M_f_star
    strict_channel: M_f_c_star
    development_only: true
    nested_refit_required: true
    complete_channel_grid_required: true
    gate1_learner_id: elastic_net_logistic
    gate1_feature_group: full
    no_candidate_value: none
    stability_minimum_selected_folds: 3
    stability_denominator_folds: 4
  l2_missingness:
    normalize_over_observed_channels: true
    minimum_coverage_required: true
    minimum_observed_channels: 1
    training_normalization: empirical_cdf_within_training_fold
    sensitivities:
    - mean
    - neutral
    - complete_channel_subset
  l2_scoring:
    formula: quality_delay_weighted_observed_source_mean
    supported_formula: quality_delay_weighted_observed_source_mean
    source_quality_by_profile:
      financial_statement_core_long: 1.0
      audit_annual_long: 1.0
      sanction_evidence: 1.0
    delay_half_life_days: 365
    channel_weights: equal
  primary_source_set_id: primary_annual_measurement
  boundary_s3_endpoint: S3_CONTENT
  source_sets:
    primary_annual_measurement:
      role: primary_measurement
      temporal_alignment: fiscal_year_annual_reporting
      sources:
      - S1_profit_adjustment
      - S1_revenue_adjustment
      - S2_audit_opinion
    s3_content_boundary:
      role: prospective_enforcement_boundary
      temporal_alignment: next_calendar_year_regulatory_event
      sources:
      - S3_CONTENT
    s3_reporting_boundary:
      role: prospective_enforcement_boundary
      temporal_alignment: next_calendar_year_regulatory_event
      sources:
      - S3_REPORTING
    s3_timeliness_boundary:
      role: prospective_enforcement_boundary
      temporal_alignment: next_calendar_year_regulatory_event
      sources:
      - S3_TIMELINESS
    s3_broad_descriptive:
      role: descriptive_falsification_only
      temporal_alignment: next_calendar_year_regulatory_event
      sources:
      - S3_BROAD
