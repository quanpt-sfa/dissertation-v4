data_sources:
  declared_channels:
  - S1
  - S2
  - S3
  eligibility:
    availability_date_required: true
    firm_year_link_reliability_required: true
  source_set_changes_create_new_estimand: true
  leave_one_channel_out_required: true
  enforcement_proxy:
    role: selectively_observed_positive_evidence
    high_specificity_assumed: false
    adjudication_specificity_identified: false
    verification_selection_observed_by_default: false
    recording_process_observed_by_default: false
    legacy_high_confirmation_metadata_role: provenance_only
  anchor:
    preferred_term: positive_evidence_channel
    eligible_source_types:
    - official
    - judicial
    high_confirmation_required: false
    high_specificity_assumed: false
    clean_positive_assumption_role: sensitivity_only
    legacy_anchor_vocabulary_role: compatibility_only
    false_positive_rate_grid:
    - 0.0
    - 0.01
    - 0.03
    - 0.05
  source_registry:
    root_environment_variable: DISSERTATION_RAW_ROOT
    schema_evolution_policy: fail_on_unregistered_fields
    hash_policy: locked_sha256_required
    provenance_contract:
      manifest_relative_path: extract_provenance.json
      required: true
      required_fields:
      - vendor
      - vendor_product
      - pull_date
      - vendor_version
      - extract_query
      - revision_policy
      - point_in_time_vintages_available
    sources: {}
