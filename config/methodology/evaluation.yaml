evaluation:
  ap_soft_targets: false
  benchmark_ladder:
  - fixed_accounting
  - reestimated_linear
  - observability_only
  - content_only
  - full
  - nonlinear
  benchmark_status:
    fixed_accounting:
      status: BLOCKED_UNTIL_MAPPING_REVIEW
      reason_code: BENEISH_VN_MAPPING_REVIEW_REQUIRED
      operational_results_may_be_claimed: false
  pu_branch: separate
  review_budget:
    primary_fraction: 0.05
    sensitivity_fractions:
    - 0.01
    - 0.1
    fixed_case_count_sensitivity: true
  domain_transfer:
    bindings:
    - domain_id: exchange_or_board
      column: exchange_or_board
    minimum_domains: 2
    time_basis: prediction_time
    migration_policy: row_level_board_as_of_prediction_time
    scenario_unit: domain_level_x_outer_fold
    support_method: balanced_logistic_domain_propensity_held_test_fraction
    support_population: development_other_domains_vs_held_outer_domain
    weighting_mode: unit_weight_transport_refit
    candidate_specific: true
  gate2:
    simultaneous_interval_level: 0.95
    delta_ap_interval_lower_above_zero: true
    minimum_meaningful_improvement:
      absolute: 0.01
      relative_to_reference_ap: 0.1
      operator: max
    same_direction_min_folds: 3
    fold_count: 4
    candidate_family_count: 3
    candidate_ids:
    - track_l1:elastic_net_logistic:full
    - track_l1:random_forest:full
    - track_l1:main_boosting:full
    reference_by_candidate:
      track_l1:elastic_net_logistic:full: track_l1:elastic_net_logistic:observability_only
      track_l1:random_forest:full: track_l1:random_forest:observability_only
      track_l1:main_boosting:full: track_l1:main_boosting:observability_only
    minimum_valid_bootstrap_replications: 1800
    yield_at_primary_budget_relative_decline_max: 0.05
    confirmatory_positive_count_min: 25
    sensitivity_positive_count_range:
    - 15
    - 24
  gate3:
    breakpoint_tolerance_training_sd: 0.1
    cross_domain_breakpoint_difference_max_sd: 0.2
    common_support_min_fraction_each_domain: 0.8
    minimum_fraction_each_side: 0.1
    same_direction_min_folds: 3
    fold_count: 4
    minimum_domains: 2
    interaction_parent_must_pass_gate2: true
    initial_fold_role: separate
    breakpoint_grid:
      lower_quantile: 0.1
      upper_quantile: 0.9
      points: 17
    logistic_fit:
      inverse_regularization: 1000000.0
      maximum_iterations: 2000
  gate_common:
    noninferiority_relative_ap_margin: 0.05
    robust_scenario_fraction_min: 0.8
    familywise_alpha: 0.05
    power_target: 0.8
    ess_fraction_min: 0.5
    ess_absolute_min: 100
    propensity_support:
    - 0.05
    - 0.95
    support_fraction_min: 0.8
  track_b_metrics:
    fit:
    - soft_loss
    - concordance
    binary_transfer:
    - average_precision
    - precision_at_k
    - lift
    ap_directly_on_soft_targets: false
