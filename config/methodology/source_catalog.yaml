source_catalog:
  root_environment_variable: DISSERTATION_RAW_ROOT
  snapshot_schema_version: 1
  profiles:
    financial_statement_core_long:
      enabled: true
      required: true
      discovery:
        globs:
        - data/source/vn_pipeline_final_firm_year_2015_2025.parquet
        excludes: []
        cardinality: one
      format: parquet
      reader: {}
      channel_id: S1
      source_type: final_firm_year_master
      source_agency: curated_final_input_builder
      original_unit: firm-year
      role: evidence
      verification_status: observed_opportunity_only
      coverage_dimensions:
      - fiscal_year
      - exchange_or_board
      - industry_code
      data_risks:
      - duplicate_firm_year
      - schema_drift
      - missing_prepost_components
      - stale_final_build
      semantic_fields:
        firm_id:
        - firm_master_id
        fiscal_year:
        - fiscal_year
        availability_date:
        - prediction_time
        pat_unaudited:
        - fs_unaud_profit_after_tax
        pat_audited:
        - fs_aud_profit_after_tax
        revenue_unaudited:
        - fs_unaud_net_revenue
        revenue_audited:
        - fs_aud_net_revenue
        source_snapshot_hash:
        - source_unified_population_sha256
      required_semantic_fields:
      - firm_id
      - fiscal_year
      - availability_date
      - pat_unaudited
      - pat_audited
      - revenue_unaudited
      - revenue_audited
      - source_snapshot_hash
      key_semantics:
      - firm_id
      - fiscal_year
      date_semantics:
      - availability_date
      evidence_mapping:
        processor: audit_adjustment
        temporal_role: annual_measurement_at_anchor
        availability_rule: common_annual_anchor
        explicit_negative_allowed: true
        absence_policy: unknown
        opportunity_semantic: derived_matched_pair
        duplicate_representative_rule: fail_on_duplicate_status_record
        wide_components:
          S1_profit_adjustment:
            unaudited_semantic: pat_unaudited
            audited_semantic: pat_audited
          S1_revenue_adjustment:
            unaudited_semantic: revenue_unaudited
            audited_semantic: revenue_audited
        audit_adjustment:
          unaudited_status: unaudited
          audited_status: audited
          expected_unit: VND
          expected_scope: consolidated
          denominator: absolute_post_audit_value
          minimum_absolute_denominator: 0.0
        logical_sources:
        - source_id: S1_profit_adjustment
          endpoint_id: profit_adjustment
          canonical_item: income_statement__18_loi_nhuan_sau_thue_thu_nhap_doanh_nghiep
          statement_family: income_statement
          materiality_threshold: 0.1
        - source_id: S1_revenue_adjustment
          endpoint_id: revenue_adjustment
          canonical_item: income_statement__3_doanh_thu_thuan
          statement_family: income_statement
          materiality_threshold: 0.01
      panel_mapping:
        enabled: true
        core_predictor: true
        contributes_to_firm_master: true
        availability_date_rule: physical_column
        row_aggregation: one_row_per_firm_year

    audit_annual_long:
      enabled: true
      required: true
      discovery:
        globs:
        - data/source/vn_pipeline_final_firm_year_2015_2025.parquet
        excludes: []
        cardinality: one
      format: parquet
      reader: {}
      channel_id: S2
      source_type: final_firm_year_master
      source_agency: curated_final_input_builder
      original_unit: firm-year
      role: evidence
      verification_status: observed_opportunity_only
      coverage_dimensions:
      - fiscal_year
      - s2_audit_indicator
      data_risks:
      - missing_audit_report
      - opinion_normalization
      - stale_final_build
      semantic_fields:
        firm_id:
        - firm_master_id
        fiscal_year:
        - fiscal_year
        audit_report_observed:
        - s2_audit_indicator
        audit_opinion:
        - s2_audit_opinion
        audit_firm:
        - s2_audit_firm
      required_semantic_fields:
      - firm_id
      - fiscal_year
      - audit_report_observed
      - audit_opinion
      key_semantics:
      - firm_id
      - fiscal_year
      date_semantics: []
      evidence_mapping:
        processor: audit_opinion
        temporal_role: annual_measurement_at_anchor
        availability_rule: common_annual_anchor
        explicit_negative_allowed: true
        absence_policy: unknown
        opportunity_semantic: derived_valid_audit_report
        duplicate_representative_rule: identical_normalized_opinion_or_fail
        wide_opinion:
          observation_semantic: audit_report_observed
          opinion_semantic: audit_opinion
          source_ref_semantic: audit_firm
        audit_opinion:
          indicator_value: audit_opinion
          period_type: annual
          statement_scope: consolidated
          audited_status: audited
          raw_to_normalized:
            Chấp nhận toàn phần: clean
            Ý kiến ngoại trừ: qualified
            Từ chối ra ý kiến: disclaimer
            Ý kiến trái ngược: adverse
            clean: clean
            unmodified: clean
            qualified: qualified
            disclaimer: disclaimer
            adverse: adverse
          positive_categories:
          - qualified
          - disclaimer
          - adverse
          explicit_negative_categories:
          - clean
          pending_categories:
          - warning
          - emphasis_of_matter
          - other_matter
        logical_sources:
        - source_id: S2_audit_opinion
          endpoint_id: non_clean_audit_opinion
      panel_mapping:
        enabled: false

    sanction_evidence:
      enabled: true
      required: true
      discovery:
        globs:
        - data/source/vn_pipeline_final_firm_year_2015_2025.parquet
        excludes: []
        cardinality: one
      format: parquet
      reader: {}
      channel_id: S3
      source_type: final_firm_year_master
      source_agency: curated_final_input_builder
      original_unit: firm-year
      role: evidence
      verification_status: selectively_observed_enforcement_proxy
      measurement_process_role: public_positive_evidence_with_selective_verification
      high_specificity_assumed: false
      coverage_dimensions:
      - fiscal_year
      - endpoint_specific_source_opportunity
      data_risks:
      - incomplete_source_year
      - endpoint_aggregation_error
      - missing_decision_provenance
      - stale_final_build
      semantic_fields:
        firm_id:
        - firm_master_id
        fiscal_year:
        - fiscal_year
        s3_broad_endpoint:
        - s3_broad_endpoint_evidence
        s3_broad_source_opportunity:
        - s3_broad_source_opportunity
        s3_broad_observation_opportunity:
        - s3_broad_observation_opportunity
        s3_broad_provenance:
        - s3_broad_provenance_json
        s3_reporting_endpoint:
        - s3_reporting_endpoint_evidence
        s3_reporting_source_opportunity:
        - s3_reporting_source_opportunity
        s3_reporting_observation_opportunity:
        - s3_reporting_observation_opportunity
        s3_reporting_provenance:
        - s3_reporting_provenance_json
        s3_content_endpoint:
        - s3_content_endpoint_evidence
        s3_content_source_opportunity:
        - s3_content_source_opportunity
        s3_content_observation_opportunity:
        - s3_content_observation_opportunity
        s3_content_provenance:
        - s3_content_provenance_json
        s3_timeliness_endpoint:
        - s3_timeliness_endpoint_evidence
        s3_timeliness_source_opportunity:
        - s3_timeliness_source_opportunity
        s3_timeliness_observation_opportunity:
        - s3_timeliness_observation_opportunity
        s3_timeliness_provenance:
        - s3_timeliness_provenance_json
      required_semantic_fields:
      - firm_id
      - fiscal_year
      - s3_broad_endpoint
      - s3_broad_source_opportunity
      - s3_broad_observation_opportunity
      - s3_broad_provenance
      - s3_reporting_endpoint
      - s3_reporting_source_opportunity
      - s3_reporting_observation_opportunity
      - s3_reporting_provenance
      - s3_content_endpoint
      - s3_content_source_opportunity
      - s3_content_observation_opportunity
      - s3_content_provenance
      - s3_timeliness_endpoint
      - s3_timeliness_source_opportunity
      - s3_timeliness_observation_opportunity
      - s3_timeliness_provenance
      key_semantics:
      - firm_id
      - fiscal_year
      date_semantics: []
      evidence_mapping:
        processor: sanction_calendar_year
        temporal_role: next_calendar_year_regulatory_event
        availability_rule: sanction_calendar_year
        explicit_negative_allowed: true
        observed_endpoint_zero_allowed: true
        legacy_explicit_negative_term_deprecated: true
        absence_policy: observed_endpoint_zero_when_complete_source_year
        zero_label_interpretation: observed_source_endpoint_zero_not_latent_negative
        opportunity_semantic: endpoint_specific_source_opportunity
        duplicate_representative_rule: identical_signature_then_document_id_firm
        target_year_rule: sanction_year_minus_one
        decision_key_semantic: document_id
        decision_provenance_semantic: decision_number
        affected_fiscal_year_role: sensitivity_provenance_only
        taxonomy_registry: s3_taxonomy
        sanction_year_precedence:
        - sanction_year
        - decision_date
        - publish_date
        label_known_date_precedence:
        - label_known_date
        - publish_date
        - decision_date
        measurement_process:
          observation_opportunity: endpoint_specific_observation_opportunity
          verification: observed_true_only_for_public_positive_endpoint
          determination: endpoint_specific_public_determination
          recording: public_decision_recorded
          observed_source_label: preaggregated_endpoint_incidence
          high_specificity_assumed: false
        wide_endpoints:
          endpoint_bindings:
            S3_BROAD:
              outcome_semantic: s3_broad_endpoint
              source_opportunity_semantic: s3_broad_source_opportunity
              observation_opportunity_semantic: s3_broad_observation_opportunity
              provenance_semantic: s3_broad_provenance
            S3_REPORTING:
              outcome_semantic: s3_reporting_endpoint
              source_opportunity_semantic: s3_reporting_source_opportunity
              observation_opportunity_semantic: s3_reporting_observation_opportunity
              provenance_semantic: s3_reporting_provenance
            S3_CONTENT:
              outcome_semantic: s3_content_endpoint
              source_opportunity_semantic: s3_content_source_opportunity
              observation_opportunity_semantic: s3_content_observation_opportunity
              provenance_semantic: s3_content_provenance
            S3_TIMELINESS:
              outcome_semantic: s3_timeliness_endpoint
              source_opportunity_semantic: s3_timeliness_source_opportunity
              observation_opportunity_semantic: s3_timeliness_observation_opportunity
              provenance_semantic: s3_timeliness_provenance
        logical_sources:
        - source_id: S3_BROAD
          endpoint_id: S3_BROAD
        - source_id: S3_REPORTING
          endpoint_id: S3_REPORTING
        - source_id: S3_CONTENT
          endpoint_id: S3_CONTENT
        - source_id: S3_TIMELINESS
          endpoint_id: S3_TIMELINESS
