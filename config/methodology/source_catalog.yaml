source_catalog:
  root_environment_variable: DISSERTATION_RAW_ROOT
  snapshot_schema_version: 1
  profiles:
    final_firm_year_s1:
      enabled: true
      required: true
      discovery:
        globs:
        - data/source/vn_pipeline_final_firm_year_2015_2025.parquet
        excludes: []
        cardinality: one
      format: parquet
      reader: {}
      channel_id: S1
      source_type: final_firm_year_master
      source_agency: curated_final_input_builder
      original_unit: firm-year
      role: evidence
      verification_status: observed_opportunity_only
      coverage_dimensions:
      - fiscal_year
      - exchange_at_fye
      - industry_code
      data_risks:
      - duplicate_firm_year
      - schema_drift
      - missing_prepost_components
      - stale_final_build
      semantic_fields:
        firm_id:
        - firm_master_id
        ticker:
        - issuer_ticker
        fiscal_year:
        - fiscal_year
        availability_date:
        - prediction_time
        pat_unaudited:
        - pat_unaudited
        pat_audited:
        - pat_audited
        revenue_unaudited:
        - revenue_unaudited
        revenue_audited:
        - revenue_audited
        source_snapshot_hash:
        - source_snapshot_hash
      required_semantic_fields:
      - firm_id
      - fiscal_year
      - availability_date
      - pat_unaudited
      - pat_audited
      - revenue_unaudited
      - revenue_audited
      - source_snapshot_hash
      key_semantics:
      - firm_id
      - fiscal_year
      date_semantics:
      - availability_date
      evidence_mapping:
        processor: audit_adjustment
        temporal_role: annual_measurement_at_anchor
        availability_rule: common_annual_anchor
        explicit_negative_allowed: true
        absence_policy: unknown
        opportunity_semantic: derived_matched_pair
        duplicate_representative_rule: fail_on_duplicate_status_record
        wide_components:
          S1_profit_adjustment:
            unaudited_semantic: pat_unaudited
            audited_semantic: pat_audited
          S1_revenue_adjustment:
            unaudited_semantic: revenue_unaudited
            audited_semantic: revenue_audited
        audit_adjustment:
          unaudited_status: unaudited
          audited_status: audited
          expected_unit: VND
          expected_scope: consolidated
          denominator: absolute_post_audit_value
          minimum_absolute_denominator: 0.0
        logical_sources:
        - source_id: S1_profit_adjustment
          endpoint_id: profit_adjustment
          canonical_item: income_statement__18_loi_nhuan_sau_thue_thu_nhap_doanh_nghiep
          statement_family: income_statement
          materiality_threshold: 0.1
        - source_id: S1_revenue_adjustment
          endpoint_id: revenue_adjustment
          canonical_item: income_statement__3_doanh_thu_thuan
          statement_family: income_statement
          materiality_threshold: 0.01
      panel_mapping:
        enabled: true
        core_predictor: true
        contributes_to_firm_master: true
        availability_date_rule: physical_column
        row_aggregation: one_row_per_firm_year

    final_firm_year_s2:
      enabled: true
      required: true
      discovery:
        globs:
        - data/source/vn_pipeline_final_firm_year_2015_2025.parquet
        excludes: []
        cardinality: one
      format: parquet
      reader: {}
      channel_id: S2
      source_type: final_firm_year_master
      source_agency: curated_final_input_builder
      original_unit: firm-year
      role: evidence
      verification_status: observed_opportunity_only
      coverage_dimensions:
      - fiscal_year
      - audit_report_observed
      data_risks:
      - missing_audit_report
      - opinion_normalization
      - stale_final_build
      semantic_fields:
        firm_id:
        - firm_master_id
        fiscal_year:
        - fiscal_year
        audit_report_observed:
        - audit_report_observed
        audit_opinion:
        - audit_opinion_raw
        audit_report_version_id:
        - audit_report_version_id
      required_semantic_fields:
      - firm_id
      - fiscal_year
      - audit_report_observed
      - audit_opinion
      key_semantics:
      - firm_id
      - fiscal_year
      date_semantics: []
      evidence_mapping:
        processor: audit_opinion
        temporal_role: annual_measurement_at_anchor
        availability_rule: common_annual_anchor
        explicit_negative_allowed: true
        absence_policy: unknown
        opportunity_semantic: derived_valid_audit_report
        duplicate_representative_rule: identical_normalized_opinion_or_fail
        wide_opinion:
          observation_semantic: audit_report_observed
          opinion_semantic: audit_opinion
          source_ref_semantic: audit_report_version_id
        audit_opinion:
          indicator_value: audit_opinion
          period_type: annual
          statement_scope: consolidated
          audited_status: audited
          raw_to_normalized:
            Chấp nhận toàn phần: clean
            Ý kiến ngoại trừ: qualified
            Từ chối ra ý kiến: disclaimer
            Ý kiến trái ngược: adverse
            clean: clean
            qualified: qualified
            disclaimer: disclaimer
            adverse: adverse
          positive_categories:
          - qualified
          - disclaimer
          - adverse
          explicit_negative_categories:
          - clean
          pending_categories:
          - warning
          - emphasis_of_matter
          - other_matter
        logical_sources:
        - source_id: S2_audit_opinion
          endpoint_id: non_clean_audit_opinion
      panel_mapping:
        enabled: false

    final_firm_year_s3:
      enabled: true
      required: true
      discovery:
        globs:
        - data/source/vn_pipeline_final_firm_year_2015_2025.parquet
        excludes: []
        cardinality: one
      format: parquet
      reader: {}
      channel_id: S3
      source_type: final_firm_year_master
      source_agency: curated_final_input_builder
      original_unit: firm-year
      role: evidence
      verification_status: selectively_observed_enforcement_proxy
      coverage_dimensions:
      - fiscal_year
      - s3_source_opportunity
      data_risks:
      - incomplete_source_year
      - endpoint_aggregation_error
      - missing_decision_provenance
      - stale_final_build
      semantic_fields:
        firm_id:
        - firm_master_id
        fiscal_year:
        - fiscal_year
        s3_source_opportunity:
        - s3_source_opportunity
        s3_broad_endpoint:
        - s3_broad_endpoint
        s3_reporting_endpoint:
        - s3_reporting_endpoint
        s3_content_endpoint:
        - s3_content_endpoint
        s3_timeliness_endpoint:
        - s3_timeliness_endpoint
        s3_document_ids_json:
        - s3_document_ids_json
        s3_first_label_known_date:
        - s3_first_label_known_date
        s3_last_label_known_date:
        - s3_last_label_known_date
        s3_taxonomy_codes_json:
        - s3_taxonomy_codes_json
      required_semantic_fields:
      - firm_id
      - fiscal_year
      - s3_source_opportunity
      - s3_broad_endpoint
      - s3_reporting_endpoint
      - s3_content_endpoint
      - s3_timeliness_endpoint
      - s3_document_ids_json
      - s3_first_label_known_date
      - s3_last_label_known_date
      - s3_taxonomy_codes_json
      key_semantics:
      - firm_id
      - fiscal_year
      date_semantics:
      - s3_first_label_known_date
      - s3_last_label_known_date
      evidence_mapping:
        processor: sanction_calendar_year
        temporal_role: next_calendar_year_regulatory_event
        availability_rule: sanction_calendar_year
        explicit_negative_allowed: true
        observed_endpoint_zero_allowed: true
        absence_policy: observed_endpoint_zero_when_complete_source_year
        opportunity_semantic: s3_source_opportunity
        duplicate_representative_rule: identical_signature_then_document_id_firm
        target_year_rule: sanction_year_minus_one
        decision_key_semantic: document_id
        decision_provenance_semantic: decision_number
        affected_fiscal_year_role: sensitivity_provenance_only
        taxonomy_registry: s3_taxonomy
        sanction_year_precedence:
        - sanction_year
        - decision_date
        - publish_date
        label_known_date_precedence:
        - label_known_date
        - publish_date
        - decision_date
        wide_endpoints:
          source_opportunity_semantic: s3_source_opportunity
          document_ids_semantic: s3_document_ids_json
          first_label_known_date_semantic: s3_first_label_known_date
          last_label_known_date_semantic: s3_last_label_known_date
          taxonomy_codes_semantic: s3_taxonomy_codes_json
          endpoint_semantics:
            S3_BROAD: s3_broad_endpoint
            S3_REPORTING: s3_reporting_endpoint
            S3_CONTENT: s3_content_endpoint
            S3_TIMELINESS: s3_timeliness_endpoint
        logical_sources:
        - source_id: S3_BROAD
          endpoint_id: S3_BROAD
        - source_id: S3_REPORTING
          endpoint_id: S3_REPORTING
        - source_id: S3_CONTENT
          endpoint_id: S3_CONTENT
        - source_id: S3_TIMELINESS
          endpoint_id: S3_TIMELINESS
      panel_mapping:
        enabled: false

    final_firm_year_known_cases:
      enabled: true
      required: true
      discovery:
        globs:
        - data/source/vn_pipeline_final_firm_year_2015_2025.parquet
        excludes: []
        cardinality: one
      format: parquet
      reader: {}
      channel_id: S3
      source_type: final_firm_year_master
      source_agency: curated_final_input_builder
      original_unit: firm-year
      role: known_case
      verification_status: externally_reviewed_positive_case
      coverage_dimensions:
      - fiscal_year
      data_risks:
      - embedded_case_metadata_missing
      - eligibility_mismatch
      semantic_fields:
        firm_id:
        - firm_master_id
        fiscal_year:
        - fiscal_year
        case_id:
        - known_case_id
        case_construct:
        - known_case_construct
        case_role:
        - known_case_role
        training_include_flag:
        - known_case_training_include_flag
        calibration_include_flag:
        - known_case_calibration_include_flag
        model_selection_include_flag:
        - known_case_model_selection_include_flag
        external_validation_include_flag:
        - known_case_external_validation_include_flag
      required_semantic_fields:
      - firm_id
      - fiscal_year
      key_semantics:
      - firm_id
      - fiscal_year
      date_semantics: []
      panel_mapping:
        enabled: false
