name: A01-A15 diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Capture full diagnostics
        run: |
          mkdir -p artifacts/a01-a15
          set +e
          uv run ruff check . > artifacts/a01-a15/ruff.log 2>&1
          echo "exit_code=$?" >> artifacts/a01-a15/ruff.log
          uv run ruff format --check . > artifacts/a01-a15/format.log 2>&1
          echo "exit_code=$?" >> artifacts/a01-a15/format.log
          uv run python scripts/check_pyright_ratchet.py \
            --baseline config/quality/pyright_baseline.json \
            --diff-base "${{ github.event.pull_request.base.sha }}" \
            > artifacts/a01-a15/pyright.log 2>&1
          echo "exit_code=$?" >> artifacts/a01-a15/pyright.log
          uv run pytest -q > artifacts/a01-a15/pytest.log 2>&1
          echo "exit_code=$?" >> artifacts/a01-a15/pytest.log
          set -e
      - uses: actions/upload-artifact@v4
        with:
          name: a01-a15-diagnostics
          path: artifacts/a01-a15
          if-no-files-found: error
