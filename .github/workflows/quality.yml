name: quality

on: [push, pull_request]

jobs:
  p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --validate-only
      - run: uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --write
      - run: uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --check
      - run: uv run pytest --collect-only -q
      - run: uv run ruff check .
      - id: ruff_format
        continue-on-error: true
        run: uv run ruff format --check --diff . 2>&1 | tee ruff-format.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-format
          path: ruff-format.log
      - if: steps.ruff_format.outcome == 'failure'
        run: exit 1
      - run: uv run pyright
      - run: uv run pytest -q
      - run: uv run pre-commit run --all-files
