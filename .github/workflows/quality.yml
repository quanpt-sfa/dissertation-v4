name: quality

on: [push, pull_request]

permissions:
  contents: write

jobs:
  p0:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Align exact runtime-hardening guards
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/_agent_runtime_hardening_patch.py")
          text = path.read_text(encoding="utf-8")

          old = '        7,\n        context="simulation fold-safe imputers",'
          new = '        8,\n        context="simulation fold-safe imputers",'
          if text.count(old) != 1:
              raise SystemExit(f"expected one simulation imputer guard, found {text.count(old)}")
          text = text.replace(old, new)

          old_block = '''    text = replace_count(
              text,
              'LogisticRegression(\\n                    penalty="l2",',
              'make_logistic_regression(\\n                    penalty_kind="l2",',
              2,
              context="simulation L2 logistic compatibility",
          )
          '''
          new_block = '''    text = replace_once(
              text,
              'LogisticRegression(\\n                    penalty="l2",',
              'make_logistic_regression(\\n                    penalty_kind="l2",',
              context="simulation L2 logistic compatibility path 1",
          )
              text = replace_once(
              text,
              'LogisticRegression(\\n                        penalty="l2",',
              'make_logistic_regression(\\n                        penalty_kind="l2",',
              context="simulation L2 logistic compatibility path 2",
          )
          '''
          if text.count(old_block) != 1:
              raise SystemExit(f"expected one L2 replacement block, found {text.count(old_block)}")
          text = text.replace(old_block, new_block)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - run: python scripts/_agent_runtime_hardening_patch.py
      - run: uv sync --all-extras
      - run: >-
          uv run ruff format
          scripts/run_pipeline.py
          scripts/p08b_run_batch.py
          src/core/sklearn_support.py
          src/simulation/service.py
          src/modeling/service.py
          src/splits/service.py
          src/sensitivity/domain_transfer.py
          tests/test_runtime_hardening.py
      - run: uv run ruff check .
      - run: >-
          uv run pytest -q
          tests/test_runtime_hardening.py
          tests/stages/test_remaining_stage_invariants.py
          tests/stages/test_p13_candidate_domain_transfer.py
      - name: Restore canonical quality workflow
        run: git checkout origin/main -- .github/workflows/quality.yml
      - name: Commit runtime hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden runtime execution and numerical fitting"
          git push origin HEAD:agent/runtime-hardening-one-pass
