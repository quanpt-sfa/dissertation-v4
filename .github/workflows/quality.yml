name: format-phase2-python

on: [pull_request]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sync/chapter3-v24-identification
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Apply Ruff formatter
        run: |
          uv run ruff format \
            scripts/migrate_evidence_ledger_v6_to_v7.py \
            src/core/config_validation.py \
            src/evidence/service.py \
            src/identification/service.py \
            src/measurement/service.py \
            tests/runtime/test_artifact_store.py \
            tests/test_evidence_ledger_v7.py
      - name: Commit formatter output
        run: |
          files=(
            scripts/migrate_evidence_ledger_v6_to_v7.py
            src/core/config_validation.py
            src/evidence/service.py
            src/identification/service.py
            src/measurement/service.py
            tests/runtime/test_artifact_store.py
            tests/test_evidence_ledger_v7.py
          )
          if git diff --quiet -- "${files[@]}"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "style: format phase-two migration and identification files"
          git push origin HEAD:sync/chapter3-v24-identification
