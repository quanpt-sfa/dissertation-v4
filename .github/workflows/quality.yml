name: quality

on: [push, pull_request]

permissions:
  contents: write

jobs:
  p0:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Align exact simulation imputer guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/_agent_runtime_hardening_patch.py")
          text = path.read_text(encoding="utf-8")
          old = '        7,\n        context="simulation fold-safe imputers",'
          new = '        8,\n        context="simulation fold-safe imputers",'
          if text.count(old) != 1:
              raise SystemExit(f"expected one simulation guard, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY
      - run: python scripts/_agent_runtime_hardening_patch.py
      - run: uv sync --all-extras
      - run: >-
          uv run ruff format
          scripts/run_pipeline.py
          scripts/p08b_run_batch.py
          src/core/sklearn_support.py
          src/simulation/service.py
          src/modeling/service.py
          src/splits/service.py
          src/sensitivity/domain_transfer.py
          tests/test_runtime_hardening.py
      - run: uv run ruff check .
      - run: >-
          uv run pytest -q
          tests/test_runtime_hardening.py
          tests/stages/test_remaining_stage_invariants.py
          tests/stages/test_p13_candidate_domain_transfer.py
      - name: Restore canonical quality workflow
        run: git checkout origin/main -- .github/workflows/quality.yml
      - name: Commit runtime hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden runtime execution and numerical fitting"
          git push origin HEAD:agent/runtime-hardening-one-pass
