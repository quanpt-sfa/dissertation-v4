name: fix-phase2-formatting

on: [pull_request]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sync/chapter3-v24-identification
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Apply Ruff fixes
        run: |
          uv run ruff check --fix \
            src/evidence/migration.py \
            tests/stages/test_remaining_stage_invariants.py
          uv run ruff format \
            src/evidence/migration.py \
            tests/stages/test_remaining_stage_invariants.py
      - name: Commit fixes
        run: |
          if git diff --quiet -- \
            src/evidence/migration.py \
            tests/stages/test_remaining_stage_invariants.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/evidence/migration.py \
            tests/stages/test_remaining_stage_invariants.py
          git commit -m "style: apply Ruff fixes to phase-two evidence files"
          git push origin HEAD:sync/chapter3-v24-identification
