name: apply-chapter3-phase2

on: [pull_request]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sync/chapter3-v24-identification
      - name: Apply patch when complete
        shell: bash
        run: |
          set -euo pipefail
          chunks=(.phase2_diff_00 .phase2_diff_01 .phase2_diff_02)
          for chunk in "${chunks[@]}"; do
            if [[ ! -f "$chunk" ]]; then
              echo "patch incomplete; waiting for remaining chunks"
              exit 0
            fi
          done
          cat "${chunks[@]}" | base64 --decode | gzip --decompress > /tmp/chapter3-phase2.diff
          git apply --check /tmp/chapter3-phase2.diff
          git apply /tmp/chapter3-phase2.diff
          rm -f "${chunks[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "refactor: materialize O-V-D-R-S evidence schema and identification provenance"
          git push origin HEAD:sync/chapter3-v24-identification
