name: apply-remediation-once

on:
  push:
    branches:
      - agent/pipeline-audit-remediation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pipeline-audit-remediation
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Apply verified mechanical fixes
        run: |
          uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --validate-only
          uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --write
          uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --check
          uv run ruff check --fix . || true
          uv run ruff format .
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/assurance/test_appendix_b_decisions.py")
          text = path.read_text(encoding="utf-8")
          old = 'assert get(registry, "measurement.primary_target_id") is None'
          new = 'assert get(registry, "measurement.primary_target_id") == "L1_ANNUAL"'
          if old in text:
              path.write_text(text.replace(old, new), encoding="utf-8")
          elif new not in text:
              raise SystemExit("D05 primary-target assertion is not recognized")
          PY
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest -q
      - name: Restore standard quality workflow and commit
        run: |
          cat > .github/workflows/quality.yml <<'YAML'
          # Temporary marker removed by the connector after the bulk remediation commit.
          name: quality

          on: [push, pull_request]

          jobs:
            p0:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: astral-sh/setup-uv@v6
                - run: uv sync --all-extras
                - run: uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --validate-only
                - run: uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --write
                - run: uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --check
                - run: uv run pytest --collect-only -q
                - run: uv run ruff check .
                - run: uv run ruff format --check .
                - run: uv run pyright
                - run: uv run pytest -q
                - run: uv run pre-commit run --all-files
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply verified pipeline remediation cleanup"
          git push origin HEAD:agent/pipeline-audit-remediation
