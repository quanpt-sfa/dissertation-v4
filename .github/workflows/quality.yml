name: quality

on: [push, pull_request]

permissions:
  contents: write

jobs:
  p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --validate-only
      - run: uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --write
      - run: uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --check
      - run: uv run pytest --collect-only -q
      - run: uv run ruff check .
      - name: Apply Ruff formatting
        run: |
          uv run ruff format \
            src/core/config_validation.py \
            src/evidence/service.py \
            src/identification/service.py \
            tests/test_chapter3_v24_identification.py
      - name: Commit formatter output
        run: |
          if git diff --quiet -- \
            src/core/config_validation.py \
            src/evidence/service.py \
            src/identification/service.py \
            tests/test_chapter3_v24_identification.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/core/config_validation.py \
            src/evidence/service.py \
            src/identification/service.py \
            tests/test_chapter3_v24_identification.py
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - run: uv run ruff format --check .
      - name: Pyright ratchet for pull requests
        if: github.event_name == 'pull_request'
        run: |
          uv run python scripts/check_pyright_ratchet.py \
            --baseline config/quality/pyright_baseline.json \
            --diff-base "${{ github.event.pull_request.base.sha }}" \
            --report artifacts/quality/pyright_ratchet_report.json
      - name: Pyright ratchet for pushes
        if: github.event_name == 'push'
        run: |
          uv run python scripts/check_pyright_ratchet.py \
            --baseline config/quality/pyright_baseline.json \
            --report artifacts/quality/pyright_ratchet_report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyright-ratchet-report
          path: artifacts/quality/pyright_ratchet_report.json
          if-no-files-found: ignore
      - run: uv run pytest -q
      - run: uv run pre-commit run --all-files
