name: quality

on: [push, pull_request]

permissions:
  contents: write

jobs:
  p0:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/runtime-hardening-one-pass
      - uses: astral-sh/setup-uv@v6
      - name: Restore legacy simulation engine
        run: git checkout origin/main -- src/simulation/service.py
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: >-
          uv run pytest -q
          tests/test_runtime_hardening.py
          tests/test_chapter3_v24_identification.py
          tests/stages/test_remaining_stage_invariants.py
          tests/stages/test_p13_candidate_domain_transfer.py
      - name: Restore canonical quality workflow
        run: git checkout origin/main -- .github/workflows/quality.yml
      - name: Commit typed runtime boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: isolate P08 hardening from legacy simulation engine"
          git push origin HEAD:agent/runtime-hardening-one-pass
