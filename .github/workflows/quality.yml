name: quality

on: [push, pull_request]

jobs:
  p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --validate-only
      - run: uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --write
      - run: uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --check
      - run: uv run pytest --collect-only -q
      - name: Apply mechanical Ruff fixes in CI workspace
        run: |
          uv run ruff check --fix . || true
          uv run ruff format .
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/assurance/test_appendix_b_decisions.py")
          text = path.read_text(encoding="utf-8")
          old = 'assert get(registry, "measurement.primary_target_id") is None'
          new = 'assert get(registry, "measurement.primary_target_id") == "L1_ANNUAL"'
          if old not in text:
              raise SystemExit("D05 legacy assertion was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          uv run ruff check --fix .
          uv run ruff format .
      - name: Package autofixed files
        run: |
          git diff --name-only -z > /tmp/autofix-files.list
          tar --null -T /tmp/autofix-files.list -czf /tmp/autofix-files.tar.gz
          git diff --binary > /tmp/autofix.patch
      - uses: actions/upload-artifact@v4
        with:
          name: autofix-bundle
          path: |
            /tmp/autofix-files.tar.gz
            /tmp/autofix.patch
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - id: pyright
        continue-on-error: true
        shell: bash
        run: set -o pipefail; uv run pyright 2>&1 | tee /tmp/pyright.log
      - id: pytest
        continue-on-error: true
        shell: bash
        run: set -o pipefail; uv run pytest -q 2>&1 | tee /tmp/pytest.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            /tmp/pyright.log
            /tmp/pytest.log
      - if: steps.pyright.outcome == 'failure' || steps.pytest.outcome == 'failure'
        run: exit 1
      - run: uv run pre-commit run --all-files
