name: apply-chapter3-phase2

on: [push]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sync/chapter3-v24-identification
      - name: Apply payload when complete
        shell: bash
        run: |
          set -euo pipefail
          chunks=(.phase2_payload_00 .phase2_payload_01 .phase2_payload_02 .phase2_payload_03)
          for chunk in "${chunks[@]}"; do
            if [[ ! -f "$chunk" ]]; then
              echo "payload incomplete; waiting for remaining chunks"
              exit 0
            fi
          done
          cat "${chunks[@]}" | base64 --decode > /tmp/chapter3-phase2.tar.gz
          tar -xzf /tmp/chapter3-phase2.tar.gz -C .
          rm -f "${chunks[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "refactor: materialize O-V-D-R-S evidence schema and identification provenance"
          git push origin HEAD:sync/chapter3-v24-identification
