name: agent-pyright-details

on:
  push:
    branches:
      - agent/l3-pii-p08-architecture

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/l3-pii-p08-architecture
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Apply strict typing patch
        run: |
          cat > /tmp/l3-typefix.b64 <<'EOF'

          base64 -d /tmp/l3-typefix.b64 > /tmp/l3-typefix.patch
          git apply /tmp/l3-typefix.patch
          uv run ruff format src/simulation/l3_variants.py
          uv run ruff check src/simulation/l3_variants.py
          uv run pyright --outputjson > /tmp/pyright.json || true
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/pyright.json', encoding='utf-8'))
          errors = [
              item for item in payload.get('generalDiagnostics', [])
              if item.get('severity') == 'error'
              and item.get('file', '').endswith('src/simulation/l3_variants.py')
          ]
          if errors:
              print(json.dumps(errors, indent=2))
              raise SystemExit(1)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/l3_variants.py
          git commit -m "Fix strict typing in L3 simulation"
          git push origin HEAD:agent/l3-pii-p08-architecture
