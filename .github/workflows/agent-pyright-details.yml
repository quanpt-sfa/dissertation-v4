name: agent-pyright-details

on: [push, pull_request]

permissions:
  contents: read

jobs:
  details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Capture Pyright diagnostics
        run: |
          uv run pyright --outputjson > pyright.json || true
          python - <<'PY'
          import json
          payload = json.load(open("pyright.json", encoding="utf-8"))
          details = [
              item
              for item in payload.get("generalDiagnostics", [])
              if item.get("file", "").endswith(
                  ("src/simulation/l3_variants.py", "tests/test_l3_variants.py")
              )
          ]
          with open("pyright-details.json", "w", encoding="utf-8") as handle:
              json.dump(details, handle, ensure_ascii=False, indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pyright-details
          path: pyright-details.json
