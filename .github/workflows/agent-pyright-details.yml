name: agent-pyright-details

on: [push, pull_request]

permissions:
  contents: read

jobs:
  inspect-patched-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/l3-pii-p08-architecture
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Inspect patched source
        run: |
          set +e
          patch --verbose --forward -p1 < .github/agent/l3-typefix.patch > patch-output.txt 2>&1
          echo $? > patch-status.txt
          uv run ruff format src/simulation/l3_variants.py >> patch-output.txt 2>&1
          uv run pyright --outputjson > pyright.json 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          try:
              payload = json.loads(Path('pyright.json').read_text(encoding='utf-8'))
          except Exception as exc:
              payload = {'parse_error': str(exc), 'raw': Path('pyright.json').read_text(encoding='utf-8')}
          details = [
              item for item in payload.get('generalDiagnostics', [])
              if item.get('file', '').endswith('src/simulation/l3_variants.py')
          ] if isinstance(payload, dict) else []
          Path('l3-patched-pyright.json').write_text(
              json.dumps(details, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: l3-patch-diagnostics
          path: |
            patch-output.txt
            patch-status.txt
            l3-patched-pyright.json
