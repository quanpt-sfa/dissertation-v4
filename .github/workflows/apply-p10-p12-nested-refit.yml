name: apply-p10-p12-nested-refit

# Temporary one-shot semantic-hardening workflow; removed before merge.
on: [push, pull_request]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p10-p12-full-nesting
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run python .github/scripts/apply_p10_p12_semantic_hardening.py
      - name: Format hardened files
        run: |
          uv run ruff format \
            src/selection/nested_refit.py \
            src/selection/service.py \
            scripts/p10_select_measurement.py \
            scripts/p12_evaluate.py \
            tests/stages/test_p10_nested_refit.py
      - name: Apply safe Ruff fixes
        run: |
          uv run ruff check --fix \
            src/selection/nested_refit.py \
            src/selection/service.py \
            scripts/p10_select_measurement.py \
            scripts/p12_evaluate.py \
            tests/stages/test_p10_nested_refit.py
      - name: Ruff hardened files
        run: |
          uv run ruff check \
            src/selection/nested_refit.py \
            src/selection/service.py \
            scripts/p10_select_measurement.py \
            scripts/p12_evaluate.py \
            tests/stages/test_p10_nested_refit.py
      - name: Pytest nested hardening
        run: |
          uv run pytest -q \
            tests/stages/test_p10_nested_refit.py \
            tests/stages/test_remaining_stage_invariants.py::test_p10_selection_uses_development_history_and_removes_held_channel \
            tests/stages/test_track_b_propagation.py
      - name: Pyright nested hardening
        run: |
          mkdir -p artifacts/diagnostics
          set -o pipefail
          uv run pyright \
            src/selection/nested_refit.py \
            src/selection/service.py \
            scripts/p10_select_measurement.py \
            scripts/p11_freeze_models.py \
            scripts/p12_evaluate.py \
            tests/stages/test_p10_nested_refit.py \
            2>&1 | tee artifacts/diagnostics/p10_p12_semantic_pyright.txt
      - name: Upload semantic Pyright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-p12-semantic-pyright
          path: artifacts/diagnostics/p10_p12_semantic_pyright.txt
      - name: Commit semantic hardening
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/selection/nested_refit.py \
            src/selection/service.py \
            scripts/p10_select_measurement.py \
            scripts/p12_evaluate.py \
            tests/stages/test_p10_nested_refit.py
          if git diff --cached --quiet; then
            echo 'No semantic changes to commit'
          else
            git commit -m 'Harden nested channel selection semantics'
            git push
          fi
