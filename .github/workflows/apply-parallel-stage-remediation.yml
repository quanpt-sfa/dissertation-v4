                      {
                          "firm_master_id": "F1",
                          "fiscal_year": 2021,
                          "target_id": "L1_ANNUAL",
                          "outcome": True,
                      },
                      {
                          "firm_master_id": "F2",
                          "fiscal_year": 2021,
                          "target_id": "L1_ANNUAL",
                          "outcome": False,
                      },
                  ]
              )
              weights = {"2021": pd.DataFrame({"firm_master_id": ["F1", "F2"]})}
              exclusions = ["source:S1", "source:S2", "channel:C1", "channel:C2"]
              seeds = {("2021", exclusion): index + 1 for index, exclusion in enumerate(exclusions)}
              arguments = dict(
                  matrices=matrices,
                  feature_panel=feature_panel,
                  feature_registry=[],
                  weights_by_fold=weights,
                  outcomes=outcomes,
                  outer_folds=["2021"],
                  learner_ids=["elastic_net_logistic"],
                  learner_settings={},
                  learner_search_spaces={},
                  maximum_valid_configurations=1,
                  evaluation_target_id="L1_ANNUAL",
                  columns=columns,
                  seed_by_fold_and_exclusion=seeds,
              )
              sequential = sensitivity.source_exclusion_refits(**arguments, workers=1)
              parallel = sensitivity.source_exclusion_refits(**arguments, workers=4)
              assert parallel == sequential


          def test_p16_bootstrap_is_worker_invariant() -> None:
              frame = pd.DataFrame(
                  {
                      "_pressure_z": np.linspace(-2.0, 2.0, 24),
                      "monitor": np.tile([0.0, 1.0], 12),
                      "outcome": np.tile([0, 0, 1, 1], 6),
                  }
              )
              gate = {
                  "logistic_fit": {
                      "inverse_regularization": 1.0,
                      "maximum_iterations": 2000,
                  },
                  "breakpoint_grid": {
                      "lower_quantile": 0.2,
                      "upper_quantile": 0.8,
                      "points": 7,
                  },
              }
              sequential = _shape_bootstrap(
                  frame=frame,
                  monitoring="monitor",
                  outcome="outcome",
                  gate=gate,
                  replications=40,
                  alpha=0.05,
                  rng=np.random.default_rng(7103),
                  workers=1,
              )
              parallel = _shape_bootstrap(
                  frame=frame,
                  monitoring="monitor",
                  outcome="outcome",
                  gate=gate,
                  replications=40,
                  alpha=0.05,
                  rng=np.random.default_rng(7103),
                  workers=4,
              )
              assert parallel == sequential


          def test_runner_dispatches_workers_only_to_cpu_bound_final_stages() -> None:
              runner = (ROOT / "scripts" / "run_pipeline.py").read_text(encoding="utf-8")
              assert 'if stage_id in {"P13", "P16"}:' in runner
              assert 'os.environ.get(f"{stage_id}_WORKERS", str(workers))' in runner
              assert 'command.extend(["--workers", str(stage_workers)])' in runner
              assert '"P14": "scripts/p14_gate2.py"' in runner
              assert '"P15": "scripts/p15_open_known_cases.py"' in runner
              assert '"P17": "scripts/p17_build_outputs.py"' in runner
          '''
          Path("tests/stages/test_parallel_stage_execution.py").write_text(
