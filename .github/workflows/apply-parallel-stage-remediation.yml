              PREDICTION,
              TARGET_ID,
          )
          from gates.service import _shape_bootstrap
          from modeling.service import ModelFitResult

          ROOT = Path(__file__).resolve().parents[2]


          def _columns() -> dict[str, str]:
              return {
                  FIRM_ID: "firm_master_id",
                  FISCAL_YEAR: "fiscal_year",
                  TARGET_ID: "target_id",
                  OUTCOME: "outcome",
                  LEARNER_ID: "model_id",
                  PREDICTION: "prediction",
              }


          def test_p13_worker_count_does_not_change_results(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              columns = _columns()

              def fake_fit_fold_models(**kwargs: Any) -> ModelFitResult:
                  outer_year = int(kwargs["outer_year"])
                  target_id = str(kwargs["target_id"])
                  frame = pd.DataFrame(
                      [
                          {
                              "firm_master_id": "F1",
                              "fiscal_year": outer_year,
                              "model_id": f"model:{target_id}",
                              "prediction": 0.8,
                          },
                          {
                              "firm_master_id": "F2",
                              "fiscal_year": outer_year,
                              "model_id": f"model:{target_id}",
                              "prediction": 0.2,
                          },
                      ]
                  )
                  return ModelFitResult(
                      models={"status": "PASS"},
                      oof_predictions=pd.DataFrame(),
                      outer_predictions=frame,
                  )

              monkeypatch.setattr(sensitivity, "fit_fold_models", fake_fit_fold_models)
              matrices = {
                  "expected_sources": {"S1": "C1", "S2": "C2"},
                  "rows": [
                      {
                          FIRM_ID: "F1",
                          FISCAL_YEAR: 2021,
                          MATURE: True,
