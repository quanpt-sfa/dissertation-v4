          ) -> tuple[tuple[float, float], tuple[float, float]]:
              if workers < 1:
                  raise ValueError("bootstrap workers must be positive")
              sample_indices = [
                  rng.integers(0, len(frame), size=len(frame)) for _ in range(replications)
              ]

              def evaluate(indices: np.ndarray) -> tuple[float, float | None] | None:
                  sample = frame.iloc[indices]
                  if sample[outcome].nunique() < 2:
                      return None
                  coefficient = _interaction_coefficient(sample, monitoring, outcome, gate)
                  point, _ = _breakpoint(sample, monitoring, outcome, gate)
                  return coefficient, point

              if workers == 1 or len(sample_indices) <= 1:
