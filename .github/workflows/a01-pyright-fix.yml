name: A01 Pyright fix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remediate-a01-a15-audit
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply targeted Pyright fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          simulation = Path('src/simulation/service.py')
          text = simulation.read_text(encoding='utf-8')
          text = text.replace(
              'except (ImportError, ValueError, RuntimeError) as exc:',
              'except Exception as exc:',
              1,
          )
          simulation.write_text(text, encoding='utf-8')

          gates = Path('src/gates/service.py')
          text = gates.read_text(encoding='utf-8')
          text = text.replace(
              'direction_interval, _ = _shape_bootstrap(\n'
              '                frame=frame,\n'
              '                monitoring=monitoring,\n'
              '                outcome=outcome,\n',
              'direction_interval, _ = _shape_bootstrap(\n'
              '                frame=frame,\n'
              '                monitoring=monitoring,\n'
              '                outcome=outcome,\n'
              '                gate=gate,\n',
          )
          text = text.replace(
              '_, interval = _shape_bootstrap(\n'
              '                frame=fold_frame,\n'
              '                monitoring=monitoring,\n'
              '                outcome=outcome,\n',
              '_, interval = _shape_bootstrap(\n'
              '                frame=fold_frame,\n'
              '                monitoring=monitoring,\n'
              '                outcome=outcome,\n'
              '                gate=gate,\n',
          )
          text = text.replace(
              '    outcome: str,\n'
              '    replications: int,\n'
              '    alpha: float,\n'
              '    rng: np.random.Generator,\n'
              ') -> tuple[tuple[float, float], tuple[float, float]]:\n'
              '    coefficients: list[float] = []',
              '    outcome: str,\n'
              '    gate: dict[str, Any],\n'
              '    replications: int,\n'
              '    alpha: float,\n'
              '    rng: np.random.Generator,\n'
              ') -> tuple[tuple[float, float], tuple[float, float]]:\n'
              '    coefficients: list[float] = []',
          )
          text = text.replace(
              'coefficients.append(_interaction_coefficient(sample, monitoring, outcome))',
              'coefficients.append(_interaction_coefficient(sample, monitoring, outcome, gate))',
          )
          text = text.replace(
              'point, _ = _breakpoint(sample, monitoring, outcome)',
              'point, _ = _breakpoint(sample, monitoring, outcome, gate)',
          )
          gates.write_text(text, encoding='utf-8')

          features = Path('src/features/service.py')
          text = features.read_text(encoding='utf-8')
          marker = '\n\ndef _validate_definition(item: dict[str, object]) -> None:\n'
          if 'def validate_feature_definition(' not in text:
              index = text.index(marker)
              text = text[:index] + (
                  '\n\ndef validate_feature_definition(item: dict[str, object]) -> None:\n'
                  '    """Validate one feature registry definition against the closed contract."""\n'
                  '    _validate_definition(item)\n'
              ) + text[index:]
          features.write_text(text, encoding='utf-8')

          modeling = Path('src/modeling/service.py')
          text = modeling.read_text(encoding='utf-8')
          marker = '\n\ndef _candidate_settings(\n'
          if 'def feature_groups(' not in text:
              index = text.index(marker)
              text = text[:index] + (
                  '\n\ndef feature_groups(registry: list[dict[str, Any]]) -> dict[str, list[str]]:\n'
                  '    """Return the production feature groups used by registered learners."""\n'
                  '    return _feature_groups(registry)\n'
              ) + text[index:]
          modeling.write_text(text, encoding='utf-8')

          tests = Path('tests/test_audit_remediation_contracts.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              'from features.service import _validate_definition',
              'from features.service import validate_feature_definition',
          )
          text = text.replace(
              'from modeling.service import _feature_groups',
              'from modeling.service import feature_groups',
          )
          text = text.replace('groups = _feature_groups(definitions)', 'groups = feature_groups(definitions)')
          text = text.replace('_validate_definition(definition)', 'validate_feature_definition(definition)')
          tests.write_text(text, encoding='utf-8')

          docs = Path('docs/AUDIT_REMEDIATION_A01_A15.md')
          text = docs.read_text(encoding='utf-8')
          text = text.replace(
              '- **A-06 hardened.** The current SMOTE/ADASYN regression test passes. The remaining broad exception was narrowed to expected import/value/runtime failures; diagnostic collectors retain the concrete failure class and affected replication IDs.',
              '- **A-06 partially resolved.** The current SMOTE/ADASYN regression test passes and diagnostic collectors retain failure classes and affected replication IDs. The broad resampling exception remains unchanged because editing the historically untyped simulation module would require a separate zero-error remediation; this PR does not weaken the Pyright ratchet to conceal that backlog.',
          )
          docs.write_text(text, encoding='utf-8')
          PY
      - run: |
          uv sync --all-extras
          uv run ruff format .
          uv run ruff check .
          uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --write
      - name: Commit targeted fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Resolve strict Pyright audit regressions' || exit 0
          git push origin HEAD:agent/remediate-a01-a15-audit
