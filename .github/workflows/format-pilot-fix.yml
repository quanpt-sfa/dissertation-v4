name: format-pilot-fix

on:
  push:
    branches:
      - fix/pilot-downstream-observability
    paths:
      - .github/workflows/format-pilot-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pilot-downstream-observability
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Format changed Python files
        run: |
          uv run ruff format \
            scripts/p11_freeze_models.py \
            scripts/p14_gate2.py \
            src/modeling/pilot_contracts.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p11_freeze_models.py scripts/p14_gate2.py src/modeling/pilot_contracts.py
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "style: apply Ruff formatting to pilot fixes"
            git push origin HEAD:fix/pilot-downstream-observability
          fi
