name: generate-pyright-baseline-once

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/pyright-ratchet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pyright-ratchet
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Generate locked baseline
        run: |
          uv run python scripts/check_pyright_ratchet.py \
            --write-baseline \
            --baseline config/quality/pyright_baseline.json \
            --generated-from "$(git rev-parse HEAD)"
      - name: Commit baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/quality/pyright_baseline.json
          git commit -m "Lock Pyright diagnostic baseline"
          git push origin HEAD:agent/pyright-ratchet
