name: generate-pyright-cutover-baseline-once

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/pyright-ratchet-cutover'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pyright-ratchet-cutover
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Generate schema-v2 cutover baseline
        run: |
          CUTOVER="$(git rev-parse HEAD)"
          uv run python scripts/check_pyright_ratchet.py \
            --write-baseline \
            --baseline config/quality/pyright_baseline.json \
            --generated-from "$CUTOVER" \
            --strict-since-commit "$CUTOVER"
      - name: Commit cutover baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/quality/pyright_baseline.json
          git commit -m "Lock Pyright cutover baseline"
          git push origin HEAD:agent/pyright-ratchet-cutover
