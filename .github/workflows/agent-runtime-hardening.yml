name: agent-runtime-hardening

on:
  push:
    branches:
      - agent/runtime-hardening-one-pass

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: python scripts/_agent_runtime_hardening_patch.py
      - run: uv sync --all-extras
      - run: >-
          uv run ruff format
          scripts/run_pipeline.py
          scripts/p08b_run_batch.py
          src/core/sklearn_support.py
          src/simulation/service.py
          src/modeling/service.py
          src/splits/service.py
          src/sensitivity/domain_transfer.py
          tests/test_runtime_hardening.py
      - run: uv run ruff check .
      - run: >-
          uv run pytest -q
          tests/test_runtime_hardening.py
          tests/stages/test_remaining_stage_invariants.py
          tests/stages/test_p13_candidate_domain_transfer.py
      - name: Commit runtime hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden runtime execution and numerical fitting"
          git push origin HEAD:agent/runtime-hardening-one-pass
