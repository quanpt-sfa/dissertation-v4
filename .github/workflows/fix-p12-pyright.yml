name: fix-p12-pyright

on:
  push:
    branches:
      - fix/p07-raw-computation-report-contract

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p07-raw-computation-report-contract
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Apply typed public helper names
        run: |
          python - <<'PY'
          from pathlib import Path

          resume = Path("src/core/resume.py")
          text = resume.read_text(encoding="utf-8")
          text = text.replace("_p11_boundary_complete", "p11_boundary_complete")
          text = text.replace("_write_compatibility_receipt", "write_compatibility_receipt")
          resume.write_text(text, encoding="utf-8")

          test = Path("tests/runtime/test_p12_compatible_resume.py")
          text = test.read_text(encoding="utf-8")
          text = text.replace("_p11_boundary_complete", "p11_boundary_complete")
          text = text.replace("_write_compatibility_receipt", "write_compatibility_receipt")
          marker = "ROOT = Path(__file__).resolve().parents[2]\n\n\n"
          helper = (
              "ROOT = Path(__file__).resolve().parents[2]\n\n\n"
              "def _fixed_git_commit(_root: Path, _args: list[str]) -> str:\n"
              "    return \"new-commit\"\n\n\n"
          )
          if marker not in text:
              raise SystemExit("test helper insertion marker unavailable")
          text = text.replace(marker, helper, 1)
          text = text.replace(
              'monkeypatch.setattr(resume, "_git_output", lambda _root, _args: "new-commit")',
              'monkeypatch.setattr(resume, "_git_output", _fixed_git_commit)',
          )
          test.write_text(text, encoding="utf-8")
          PY
      - run: uv run ruff format src/core/resume.py tests/runtime/test_p12_compatible_resume.py
      - name: Commit Pyright remediation
        run: |
          if git diff --quiet -- src/core/resume.py tests/runtime/test_p12_compatible_resume.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/resume.py tests/runtime/test_p12_compatible_resume.py
          git commit -m "test: satisfy P12 resume typing contract"
          git push origin HEAD:fix/p07-raw-computation-report-contract
