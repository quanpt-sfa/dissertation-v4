name: format-p08-mcse-once

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/p08-production-mcse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p08-production-mcse
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Apply mechanical cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/p08c_aggregate_batches.py')
          text = path.read_text(encoding='utf-8')
          directive = '# ruff: noqa: E402\n'
          marker = '"""P08C collector: validate active artifacts and compute policy-aware MCSE."""\n'
          if directive not in text:
              text = text.replace(marker, marker + '\n' + directive, 1)
          path.write_text(text, encoding='utf-8')
          PY
          FILES=(
            src/simulation/mcse_contract.py
            src/simulation/mcse_service.py
            src/simulation/p08_aggregation.py
            scripts/p08c_aggregate_batches.py
            tests/stages/test_p08_mcse_contract.py
            tests/stages/test_p08_mcse_policy.py
          )
          uv run ruff check --fix "${FILES[@]}" || true
          uv run ruff format "${FILES[@]}"
          uv run ruff check "${FILES[@]}"
          uv run ruff format --check "${FILES[@]}"
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/simulation/mcse_contract.py \
            src/simulation/mcse_service.py \
            src/simulation/p08_aggregation.py \
            scripts/p08c_aggregate_batches.py \
            tests/stages/test_p08_mcse_contract.py \
            tests/stages/test_p08_mcse_policy.py
          git diff --cached --quiet || git commit -m "Format P08 MCSE policy implementation"
          git push origin HEAD:agent/p08-production-mcse
