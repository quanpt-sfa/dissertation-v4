name: Apply compact P08 batch validation fix

on:
  push:
    branches:
      - fix/p08-mcse-dissertation-budget

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[compact-batch-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p08-mcse-dissertation-budget
          fetch-depth: 0

      - name: Fix P08C compact artifact range validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/p08c_aggregate_batches.py')
          text = path.read_text(encoding='utf-8')

          old = '''    batches: list[pd.DataFrame] = []
              coordinates_seen: list[dict[str, str]] = []
              simulation = mapping(loaded.registry.get("simulation"), "simulation")
          '''
          new = '''    batches: list[pd.DataFrame] = []
              coordinates_seen: list[dict[str, str]] = []
              replication_artifacts: list[dict[str, object]] = []
              simulation = mapping(loaded.registry.get("simulation"), "simulation")
          '''
          if old not in text:
              raise SystemExit('artifact-list insertion marker not found')
          text = text.replace(old, new, 1)

          old = '''        plan = _replication_plan(simulation, method_spec)
                  batch_size = int(plan["batch_size"])
                  replication_ids = value[REPLICATION_ID].dropna().astype(int)
                  for r_id in replication_ids:
                      expected_batch_key = f"b{r_id // batch_size:04d}"
                      if coordinates.get(BATCH_KEY) != expected_batch_key:
                          raise ValueError(
                              f"replication_id={r_id} in batch maps to batch_key={expected_batch_key}, "
                              f"but coordinate is batch_key={coordinates.get(BATCH_KEY)}"
                          )

                  batches.append(value)
          '''
          new = '''        plan = _replication_plan(simulation, method_spec)
                  batch_size = int(plan["batch_size"])
                  replication_ids = sorted(
                      set(value[REPLICATION_ID].dropna().astype(int))
                  )
                  if not replication_ids:
                      raise ValueError("simulation batch contains no replication IDs")
                  expected_ids = list(
                      range(replication_ids[0], replication_ids[-1] + 1)
                  )
                  if replication_ids != expected_ids:
                      raise ValueError(
                          f"scenario={scenario_id}, method={method_id}: "
                          "simulation artifact contains a non-contiguous replication range"
                      )
                  if replication_ids[0] % batch_size != 0:
                      raise ValueError(
                          f"scenario={scenario_id}, method={method_id}: "
                          f"artifact start={replication_ids[0]} is not aligned to "
                          f"locked worker batch_size={batch_size}"
                      )
                  if len(replication_ids) % batch_size != 0:
                      raise ValueError(
                          f"scenario={scenario_id}, method={method_id}: "
                          f"artifact replication count={len(replication_ids)} is not a "
                          f"whole multiple of locked worker batch_size={batch_size}"
                      )
                  replication_artifacts.append(
                      {
                          SCENARIO_ID: scenario_id,
                          METHOD_ID: method_id,
                          BATCH_KEY: str(coordinates.get(BATCH_KEY, "")),
                          "start": replication_ids[0],
                          "end": replication_ids[-1],
                          "replications": len(replication_ids),
                          "locked_worker_batch_size": batch_size,
                      }
                  )

                  batches.append(value)
          '''
          if old not in text:
              raise SystemExit('legacy per-replication batch-key validator not found')
          text = text.replace(old, new, 1)

          old = '''        coordinates_seen.append(coordinates)

              # Full bijection check using the already-fetched inventory (no second call).
          '''
          new = '''        coordinates_seen.append(coordinates)

              _validate_replication_artifact_ranges(replication_artifacts)

              # Full bijection check using the already-fetched inventory (no second call).
          '''
          if old not in text:
              raise SystemExit('post-scan validation insertion marker not found')
          text = text.replace(old, new, 1)

          helper = '''def _validate_replication_artifact_ranges(
              records: list[dict[str, object]],
          ) -> None:
              """Validate artifact ordinals independently of worker-batch compaction."""
              grouped: dict[tuple[str, str], list[dict[str, object]]] = {}
              for record in records:
                  key = (
                      str(record[SCENARIO_ID]),
                      str(record[METHOD_ID]),
                  )
                  grouped.setdefault(key, []).append(record)

              for (scenario_id, method_id), items in sorted(grouped.items()):
                  ordered = sorted(items, key=lambda item: int(item["start"]))
                  expected_start = 0
                  for artifact_index, item in enumerate(ordered):
                      start = int(item["start"])
                      end = int(item["end"])
                      replications = int(item["replications"])
                      batch_key = str(item[BATCH_KEY])
                      expected_batch_key = f"b{artifact_index:04d}"

                      if batch_key != expected_batch_key:
                          raise ValueError(
                              f"scenario={scenario_id}, method={method_id}: "
                              f"artifact range={start}-{end} has batch_key={batch_key}; "
                              f"expected compact-artifact ordinal={expected_batch_key}"
                          )
                      if start != expected_start:
                          raise ValueError(
                              f"scenario={scenario_id}, method={method_id}: "
                              f"replication artifact ranges are not contiguous; "
                              f"expected start={expected_start}, actual start={start}"
                          )
                      if end < start or end - start + 1 != replications:
                          raise ValueError(
                              f"scenario={scenario_id}, method={method_id}: "
                              "replication artifact range metadata is inconsistent"
                          )
                      expected_start = end + 1


          '''
          marker = 'def _sanitize_normalized_cost_regret(frame: pd.DataFrame) -> pd.DataFrame:\n'
          if '_validate_replication_artifact_ranges' not in text:
              if marker not in text:
                  raise SystemExit('sanitizer marker not found')
              text = text.replace(marker, helper + marker, 1)

          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/stages/test_p08_mcse_policy.py')
          tests = test_path.read_text(encoding='utf-8')
          if 'import pytest\n' not in tests:
              tests = tests.replace('import pandas as pd\n', 'import pandas as pd\nimport pytest\n', 1)
          tests = tests.replace(
              'from scripts.p08c_aggregate_batches import _sanitize_normalized_cost_regret\n',
              'from scripts.p08c_aggregate_batches import (\n    _sanitize_normalized_cost_regret,\n    _validate_replication_artifact_ranges,\n)\n',
              1,
          )
          extra = '''

          def test_compact_artifact_ranges_use_artifact_ordinals() -> None:
              _validate_replication_artifact_ranges(
                  [
                      {
                          SCENARIO_ID: "s",
                          METHOD_ID: "m",
                          "batch_key": "b0000",
                          "start": 0,
                          "end": 2499,
                          "replications": 2500,
                          "locked_worker_batch_size": 250,
                      },
                      {
                          SCENARIO_ID: "s",
                          METHOD_ID: "m",
                          "batch_key": "b0001",
                          "start": 2500,
                          "end": 4999,
                          "replications": 2500,
                          "locked_worker_batch_size": 250,
                      },
                  ]
              )


          def test_compact_artifact_ranges_reject_gap_or_wrong_ordinal() -> None:
              with pytest.raises(ValueError, match="expected compact-artifact ordinal=b0001"):
                  _validate_replication_artifact_ranges(
                      [
                          {
                              SCENARIO_ID: "s",
                              METHOD_ID: "m",
                              "batch_key": "b0000",
                              "start": 0,
                              "end": 2499,
                              "replications": 2500,
                          },
                          {
                              SCENARIO_ID: "s",
                              METHOD_ID: "m",
                              "batch_key": "b0010",
                              "start": 2500,
                              "end": 4999,
                              "replications": 2500,
                          },
                      ]
                  )
          '''
          if 'test_compact_artifact_ranges_use_artifact_ordinals' not in tests:
              tests += extra
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Syntax check
        run: python -m compileall -q scripts/p08c_aggregate_batches.py tests/stages/test_p08_mcse_policy.py

      - name: Commit compact validation fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-p08-compact-batch-validation.yml
          git add scripts/p08c_aggregate_batches.py tests/stages/test_p08_mcse_policy.py
          git commit -m "fix(p08): validate compact artifacts by range ordinal [compact-batch-fix-applied]"
          git push origin HEAD:fix/p08-mcse-dissertation-budget
