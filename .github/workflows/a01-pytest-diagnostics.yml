name: A01 final formatting

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remediate-a01-a15-audit
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv sync --all-extras
          uv run ruff format .
          uv run ruff check .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format final audit remediation fixes'
          git push origin HEAD:agent/remediate-a01-a15-audit
