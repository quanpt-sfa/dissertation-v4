name: diagnose-p10-bootstrap

# Temporary diagnostic workflow; removed before merge.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Capture bootstrap validation
        run: |
          mkdir -p artifacts/diagnostics
          set -o pipefail
          uv run python scripts/bootstrap_repository.py \
            --config config/pipeline.yaml \
            --validate-only \
            2>&1 | tee artifacts/diagnostics/p10_bootstrap.txt
      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-bootstrap-diagnostics
          path: artifacts/diagnostics/p10_bootstrap.txt
