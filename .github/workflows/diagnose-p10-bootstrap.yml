name: diagnose-p10-bootstrap

# Temporary repair workflow; removed before merge.
on: [push, pull_request]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p10-p12-full-nesting
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run python .github/scripts/fix_p10_source_firewall.py
      - name: Validate and regenerate repository catalogs
        run: |
          uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --validate-only
          uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --write
          uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --check
      - name: Validate repaired source
        run: |
          uv run ruff check src/modeling/service.py src/selection/nested_refit.py
          uv run ruff format --check src/modeling/service.py src/selection/nested_refit.py
          uv run pyright src/modeling/service.py src/selection/nested_refit.py
          uv run pytest -q tests/stages/test_p10_nested_refit.py tests/stages/test_track_b_propagation.py
      - name: Commit firewall repair and generated catalogs
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/modeling/service.py \
            src/selection/nested_refit.py \
            docs/generated \
            AGENTS.md
          if git diff --cached --quiet; then
            echo 'No repaired files to commit'
          else
            git commit -m 'Align nested selection with source firewall'
            git push
          fi
