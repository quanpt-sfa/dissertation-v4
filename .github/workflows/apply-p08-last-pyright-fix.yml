name: apply-p08-last-pyright-fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/p08-production-mcse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p08-production-mcse
          fetch-depth: 0
      - name: Remove redundant method type guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/p08c_aggregate_batches.py')
          text = path.read_text(encoding='utf-8')
          old = '        if isinstance(method, dict) and method.get("is_active") is True\n'
          new = '        if method.get("is_active") is True\n'
          if old not in text:
              raise SystemExit('P08C redundant method guard not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p08c_aggregate_batches.py
          git commit -m "Remove redundant P08 method type guard"
          git push origin HEAD:agent/p08-production-mcse
