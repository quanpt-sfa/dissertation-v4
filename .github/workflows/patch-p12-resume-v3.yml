name: patch-p12-resume-v3

on:
  push:
    branches:
      - fix/p07-raw-computation-report-contract
    paths:
      - .github/workflows/patch-p12-resume-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p07-raw-computation-report-contract
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Apply idempotent V3 compatibility chain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          resume_path = Path("src/core/resume.py")
          source = resume_path.read_text(encoding="utf-8")
          old_constants = '''P12_SELECTION_COMPATIBILITY_PATCH_ID = "P12_SELECTION_HASH_READ_V1"
          P12_SELECTION_COMPATIBILITY_COMMIT = "3c261c5a387d83582b9cc3becbad59a6c1a7cae8"
          P12_COMPATIBILITY_PATCH_ID = "P12_PAIRED_SCOPE_V2"
          P12_COMPATIBILITY_BASE_COMMIT = "09116ea5dea68236f46b2466eb50fbfff5c2bd0a"
          '''
          new_constants = '''P12_SELECTION_COMPATIBILITY_PATCH_ID = "P12_SELECTION_HASH_READ_V1"
          P12_SELECTION_COMPATIBILITY_COMMIT = "3c261c5a387d83582b9cc3becbad59a6c1a7cae8"
          P12_PAIRED_SCOPE_COMPATIBILITY_PATCH_ID = "P12_PAIRED_SCOPE_V2"
          P12_PAIRED_SCOPE_COMPATIBILITY_COMMIT = "67857db9751e9005168c33ee49c956bc7e1340ef"
          P12_COMPATIBILITY_PATCH_ID = "P12_RESUME_IDEMPOTENCE_V3"
          P12_COMPATIBILITY_BASE_COMMIT = "09116ea5dea68236f46b2466eb50fbfff5c2bd0a"
          '''
          if old_constants not in source:
              raise SystemExit("expected compatibility constants block not found")
          source = source.replace(old_constants, new_constants, 1)

          read_end = source.index("\n\ndef _authorize_p12_compatibility_resume")
          helpers = '''

          def _receipt_quarantine_records(receipt: dict[str, object]) -> list[dict[str, object]]:
              raw = receipt.get("quarantined_partial_outputs")
              if not isinstance(raw, list):
                  raise RuntimeError("compatibility receipt quarantine records are unavailable")
              records: list[dict[str, object]] = []
              for item in cast(list[object], raw):
                  if not isinstance(item, dict):
                      raise RuntimeError("compatibility receipt quarantine record must be an object")
                  records.append(cast(dict[str, object], item))
              return records


          def _validate_current_compatibility_receipt(
              receipt: dict[str, object],
              *,
              run_root: Path,
              project_root: Path,
              source_code_hashes: dict[str, str],
              current_commit: str,
              changed_paths: list[str],
          ) -> list[dict[str, object]]:
              if (
                  receipt.get("locked_git_commit") != P12_COMPATIBILITY_BASE_COMMIT
                  or receipt.get("current_git_commit") != current_commit
                  or receipt.get("changed_paths") != changed_paths
                  or receipt.get("p11_boundary_verified") is not True
                  or receipt.get("pairing_scope_source")
                  != "evaluation.gate2.reference_by_candidate"
                  or receipt.get("pu_branch_preserved_separate") is not True
                  or receipt.get("analytical_contract_change") is not False
                  or receipt.get("access_matrix_relaxation") is not False
                  or receipt.get("registry_lock_modified") is not False
              ):
                  raise RuntimeError("resume refused: current P12 compatibility receipt is inconsistent")
              drift_raw = receipt.get("source_code_drift")
              if not isinstance(drift_raw, dict):
                  raise RuntimeError("current P12 compatibility receipt source drift is unavailable")
              drift = cast(dict[object, object], drift_raw)
              if set(str(key) for key in drift) != set(P12_COMPATIBILITY_REQUIRED_PATHS):
                  raise RuntimeError("current P12 compatibility receipt drift scope mismatch")
              for relative in P12_COMPATIBILITY_REQUIRED_PATHS:
                  entry_raw = drift.get(relative)
                  if not isinstance(entry_raw, dict):
                      raise RuntimeError(f"current P12 compatibility receipt does not bind {relative}")
                  entry = cast(dict[object, object], entry_raw)
                  if (
                      entry.get("locked_sha256") != source_code_hashes.get(relative)
                      or entry.get("current_sha256") != hash_file(project_root / relative)
                  ):
                      raise RuntimeError(
                          f"current P12 compatibility receipt implementation mismatch: {relative}"
                      )
              previous_patch_id = receipt.get("previous_patch_id")
              previous_receipt_hash = receipt.get("previous_receipt_hash")
              if isinstance(previous_patch_id, str):
                  previous = read_compatibility_receipt(run_root, previous_patch_id)
                  if previous is None or previous.get("receipt_hash") != previous_receipt_hash:
                      raise RuntimeError("current P12 compatibility receipt chain mismatch")
              return _receipt_quarantine_records(receipt)
          '''
          source = source[:read_end] + helpers + source[read_end:]

          start = source.index("    previous = read_compatibility_receipt(run_root, P12_SELECTION_COMPATIBILITY_PATCH_ID)")
          end = source.index("\n\ndef _confirmatory_folds", start)
          replacement = '''    current = read_compatibility_receipt(run_root)
              if current is not None:
                  quarantined = _validate_current_compatibility_receipt(
                      current,
                      run_root=run_root,
                      project_root=project_root,
                      source_code_hashes=source_code_hashes,
                      current_commit=current_commit,
                      changed_paths=changed_paths,
                  )
                  print(
                      "Compatibility resume reused "
                      f"patch={P12_COMPATIBILITY_PATCH_ID} resume_from=P12 "
                      f"commit={current_commit} quarantined={len(quarantined)}",
                      flush=True,
                  )
                  return current

              paired_scope = read_compatibility_receipt(
                  run_root, P12_PAIRED_SCOPE_COMPATIBILITY_PATCH_ID
              )
              selection = read_compatibility_receipt(
                  run_root, P12_SELECTION_COMPATIBILITY_PATCH_ID
              )
              previous = paired_scope or selection
              previous_hash: str | None = None
              if paired_scope is not None:
                  if (
                      paired_scope.get("locked_git_commit") != P12_COMPATIBILITY_BASE_COMMIT
                      or paired_scope.get("current_git_commit")
                      != P12_PAIRED_SCOPE_COMPATIBILITY_COMMIT
                      or paired_scope.get("pairing_scope_source")
                      != "evaluation.gate2.reference_by_candidate"
                      or paired_scope.get("pu_branch_preserved_separate") is not True
                      or paired_scope.get("p11_boundary_verified") is not True
                  ):
                      raise RuntimeError(
                          "resume refused: prior paired-scope receipt does not match its lock"
                      )
                  previous_hash = str(paired_scope["receipt_hash"])
                  quarantined = _receipt_quarantine_records(paired_scope)
              else:
                  if selection is not None:
                      if (
                          selection.get("locked_git_commit") != P12_COMPATIBILITY_BASE_COMMIT
                          or selection.get("current_git_commit")
                          != P12_SELECTION_COMPATIBILITY_COMMIT
                      ):
                          raise RuntimeError(
                              "resume refused: prior P12 selection receipt does not match its lock"
                          )
                      previous_hash = str(selection["receipt_hash"])
                  quarantined = quarantine_partial_p12_outputs(run_root, selection)

              drift: dict[str, object] = {}
              for relative in drifted_source_paths:
                  current_path = project_root / relative
                  drift[relative] = {
                      "locked_sha256": source_code_hashes[relative],
                      "current_sha256": hash_file(current_path),
                  }
              receipt: dict[str, object] = {
                  "schema_version": 3,
                  "patch_id": P12_COMPATIBILITY_PATCH_ID,
                  "resume_from": "P12",
                  "reason_code": "COMPATIBILITY_RECEIPT_REAUTHORIZATION_MUST_BE_IDEMPOTENT",
                  "protocol_hash": (run_root / "P00" / "protocol_hash.txt")
                  .read_text(encoding="utf-8")
                  .strip(),
                  "locked_git_commit": locked_commit,
                  "current_git_commit": current_commit,
                  "changed_paths": changed_paths,
                  "source_code_drift": drift,
                  "previous_patch_id": previous.get("patch_id") if previous else None,
                  "previous_receipt_hash": previous_hash,
                  "quarantined_partial_outputs": quarantined,
                  "p11_boundary_verified": True,
                  "pairing_scope_source": "evaluation.gate2.reference_by_candidate",
                  "pu_branch_preserved_separate": True,
                  "compatibility_receipt_reuse_enabled": True,
                  "analytical_contract_change": False,
                  "access_matrix_relaxation": False,
                  "registry_lock_modified": False,
              }
              receipt_hash = write_compatibility_receipt(run_root, receipt)
              receipt["receipt_hash"] = receipt_hash
              print(
                  "Compatibility resume authorized "
                  f"patch={P12_COMPATIBILITY_PATCH_ID} resume_from=P12 commit={current_commit} "
                  f"quarantined={len(quarantined)}",
                  flush=True,
              )
              return receipt
          '''
          replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in replacement.splitlines())
          source = source[:start] + replacement + source[end:]
          resume_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/runtime/test_p12_compatible_resume.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              '''    P12_COMPATIBILITY_REQUIRED_PATHS,\n    P12_SELECTION_COMPATIBILITY_COMMIT,''',
              '''    P12_COMPATIBILITY_REQUIRED_PATHS,\n    P12_PAIRED_SCOPE_COMPATIBILITY_COMMIT,\n    P12_PAIRED_SCOPE_COMPATIBILITY_PATCH_ID,\n    P12_SELECTION_COMPATIBILITY_COMMIT,''',
              1,
          )
          tests = tests.replace(
              '''    assert P12_COMPATIBILITY_PATCH_ID == "P12_PAIRED_SCOPE_V2"\n    assert P12_SELECTION_COMPATIBILITY_PATCH_ID == "P12_SELECTION_HASH_READ_V1"''',
              '''    assert P12_COMPATIBILITY_PATCH_ID == "P12_RESUME_IDEMPOTENCE_V3"\n    assert P12_PAIRED_SCOPE_COMPATIBILITY_PATCH_ID == "P12_PAIRED_SCOPE_V2"\n    assert P12_PAIRED_SCOPE_COMPATIBILITY_COMMIT == "67857db9751e9005168c33ee49c956bc7e1340ef"\n    assert P12_SELECTION_COMPATIBILITY_PATCH_ID == "P12_SELECTION_HASH_READ_V1"''',
              1,
          )
          tests += '''

          def test_authorization_chains_v2_and_reuses_v3_idempotently(
              tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          ) -> None:
              run_root = tmp_path / "run"
              project_root = tmp_path / "project"
              (run_root / "P00").mkdir(parents=True)
              protocol_hash = "p" * 64
              (run_root / "P00" / "protocol_hash.txt").write_text(
                  protocol_hash, encoding="utf-8"
              )
              locked_hashes: dict[str, str] = {}
              for index, relative in enumerate(sorted(P12_COMPATIBILITY_REQUIRED_PATHS)):
                  target = project_root / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(f"current source {index}", encoding="utf-8")
                  locked_hashes[relative] = f"{index + 1}" * 64

              quarantined = [
                  {
                      "outer_fold": "2021",
                      "artifact_id": "outer_open_receipt",
                      "content_hash": "c" * 64,
                      "manifest_hash": "m" * 64,
                  }
              ]
              v2: dict[str, object] = {
                  "schema_version": 2,
                  "patch_id": P12_PAIRED_SCOPE_COMPATIBILITY_PATCH_ID,
                  "protocol_hash": protocol_hash,
                  "locked_git_commit": P12_COMPATIBILITY_BASE_COMMIT,
                  "current_git_commit": P12_PAIRED_SCOPE_COMPATIBILITY_COMMIT,
                  "quarantined_partial_outputs": quarantined,
                  "p11_boundary_verified": True,
                  "pairing_scope_source": "evaluation.gate2.reference_by_candidate",
                  "pu_branch_preserved_separate": True,
              }
              v2_hash = write_compatibility_receipt(run_root, v2)
              changed_paths = sorted(P12_COMPATIBILITY_ALLOWED_PATHS)
              monkeypatch.setattr(resume, "_git_output", lambda _root, _args: "new-commit")
              monkeypatch.setattr(resume, "_git_lines", lambda _root, _args: changed_paths)
              monkeypatch.setattr(resume, "_require_git_ancestor", lambda *_args: None)
              monkeypatch.setattr(resume, "p11_boundary_complete", lambda _root: True)

              def unexpected_quarantine(*_args: object, **_kwargs: object) -> list[dict[str, object]]:
                  raise AssertionError("V2 audit records must be reused, not recomputed")

              monkeypatch.setattr(
                  resume, "quarantine_partial_p12_outputs", unexpected_quarantine
              )
              kwargs = {
                  "project_root": project_root,
                  "run_root": run_root,
                  "manifest": {"git_commit": P12_COMPATIBILITY_BASE_COMMIT},
                  "source_code_hashes": locked_hashes,
                  "drifted_source_paths": sorted(P12_COMPATIBILITY_REQUIRED_PATHS),
              }
              first = resume._authorize_p12_compatibility_resume(**kwargs)
              assert first["patch_id"] == P12_COMPATIBILITY_PATCH_ID
              assert first["previous_patch_id"] == P12_PAIRED_SCOPE_COMPATIBILITY_PATCH_ID
              assert first["previous_receipt_hash"] == v2_hash
              assert first["quarantined_partial_outputs"] == quarantined

              second = resume._authorize_p12_compatibility_resume(**kwargs)
              assert second == first
          '''
          tests = "\n".join(line[10:] if line.startswith("          ") else line for line in tests.splitlines()) + "\n"
          test_path.write_text(tests, encoding="utf-8")
          PY
      - run: uv run ruff format src/core/resume.py tests/runtime/test_p12_compatible_resume.py
      - run: uv run ruff check src/core/resume.py tests/runtime/test_p12_compatible_resume.py
      - run: uv run pytest tests/runtime/test_p12_compatible_resume.py tests/stages/test_pipeline_audit_remediation.py -q
      - name: Commit patch and remove staging workflow
        shell: bash
        run: |
          rm .github/workflows/patch-p12-resume-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make P12 compatibility resume idempotent"
          git push origin HEAD:fix/p07-raw-computation-report-contract
