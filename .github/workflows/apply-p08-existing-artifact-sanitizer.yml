name: Apply P08 legacy artifact sanitizer

on:
  push:
    branches:
      - fix/p08-mcse-dissertation-budget

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[p08-sanitizer-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p08-mcse-dissertation-budget
          fetch-depth: 0

      - name: Sanitize legacy normalized-cost metrics during aggregation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/p08c_aggregate_batches.py')
          text = path.read_text(encoding='utf-8')

          if 'import math\n' not in text:
              text = text.replace('import json\n', 'import json\nimport math\n', 1)

          helper = '''def _sanitize_normalized_cost_regret(frame: pd.DataFrame) -> pd.DataFrame:
              """Recompute legacy normalized regret without the former 1e-12 denominator."""
              metric_values = frame[METRIC_ID].astype(str)
              normalized_mask = metric_values.str.endswith("::normalized_cost_regret")
              if not bool(normalized_mask.any()):
                  return frame

              key_columns = [SCENARIO_ID, METHOD_ID, REPLICATION_ID, METRIC_ID]
              if frame.duplicated(key_columns, keep=False).any():
                  raise ValueError(
                      "Cannot sanitize normalized cost regret with duplicate replication-metric rows"
                  )

              output = frame.copy()
              lookup = {
                  (
                      str(row[SCENARIO_ID]),
                      str(row[METHOD_ID]),
                      int(row[REPLICATION_ID]),
                      str(row[METRIC_ID]),
                  ): float(row["estimate"])
                  for _, row in output.iterrows()
              }

              for index, row in output.loc[normalized_mask].iterrows():
                  metric_id = str(row[METRIC_ID])
                  prefix = metric_id.rsplit("::", 1)[0]
                  base = (
                      str(row[SCENARIO_ID]),
                      str(row[METHOD_ID]),
                      int(row[REPLICATION_ID]),
                  )
                  regret_key = (*base, f"{prefix}::cost_regret_vs_oracle")
                  savings_key = (*base, f"{prefix}::cost_savings_vs_all_negative")
                  if regret_key not in lookup or savings_key not in lookup:
                      raise ValueError(
                          f"normalized cost regret companions missing for metric={metric_id}"
                      )
                  regret = lookup[regret_key]
                  savings = lookup[savings_key]
                  avoidable_cost = abs(regret + savings)
                  scale = max(abs(regret), abs(savings), 1.0)
                  output.at[index, "estimate"] = (
                      math.nan
                      if avoidable_cost <= 1e-10 * scale
                      else regret / avoidable_cost
                  )
              return output


          '''
          marker = 'def main() -> int:\n'
          if '_sanitize_normalized_cost_regret' not in text:
              if marker not in text:
                  raise SystemExit('main marker not found')
              text = text.replace(marker, helper + marker, 1)

          old = '''        if value.empty:
                      continue

                  scenario_ids = set(value[SCENARIO_ID].dropna().astype(str))
          '''
          new = '''        if value.empty:
                      continue

                  value = _sanitize_normalized_cost_regret(value)
                  scenario_ids = set(value[SCENARIO_ID].dropna().astype(str))
          '''
          if old not in text:
              raise SystemExit('batch sanitation insertion marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/stages/test_p08_mcse_policy.py')
          tests = test_path.read_text(encoding='utf-8')
          if 'from scripts.p08c_aggregate_batches import _sanitize_normalized_cost_regret' not in tests:
              tests = tests.replace(
                  'from simulation.service import (\n',
                  'from scripts.p08c_aggregate_batches import _sanitize_normalized_cost_regret\nfrom simulation.service import (\n',
                  1,
              )

          extra = '''

          def test_legacy_normalized_regret_is_recomputed_during_aggregation() -> None:
              prefix = "budget_cost::top_05pct::high_fn"
              frame = pd.DataFrame(
                  {
                      SCENARIO_ID: ["s", "s", "s", "s", "s", "s"],
                      METHOD_ID: ["m", "m", "m", "m", "m", "m"],
                      REPLICATION_ID: [0, 0, 0, 1, 1, 1],
                      METRIC_ID: [
                          f"{prefix}::normalized_cost_regret",
                          f"{prefix}::cost_regret_vs_oracle",
                          f"{prefix}::cost_savings_vs_all_negative",
                          f"{prefix}::normalized_cost_regret",
                          f"{prefix}::cost_regret_vs_oracle",
                          f"{prefix}::cost_savings_vs_all_negative",
                      ],
                      ESTIMATE: [1.0e12, 2.0, -2.0, 999.0, 2.0, 3.0],
                  }
              )
              clean = _sanitize_normalized_cost_regret(frame)
              normalized = clean.loc[
                  clean[METRIC_ID].astype(str).str.endswith("::normalized_cost_regret"),
                  ESTIMATE,
              ].tolist()
              assert math.isnan(normalized[0])
              assert normalized[1] == 0.4
          '''
          if 'test_legacy_normalized_regret_is_recomputed_during_aggregation' not in tests:
              tests += extra
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Syntax check
        run: python -m compileall -q scripts/p08c_aggregate_batches.py tests/stages/test_p08_mcse_policy.py

      - name: Commit sanitizer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-p08-existing-artifact-sanitizer.yml
          git add scripts/p08c_aggregate_batches.py tests/stages/test_p08_mcse_policy.py
          git commit -m "fix(p08): sanitize legacy normalized regret artifacts [p08-sanitizer-applied]"
          git push origin HEAD:fix/p08-mcse-dissertation-budget
