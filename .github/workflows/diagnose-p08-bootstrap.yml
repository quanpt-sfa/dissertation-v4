name: diagnose-p08-bootstrap

on:
  pull_request:

jobs:
  diagnose:
    if: github.head_ref == 'agent/p08-production-mcse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/bootstrap_repository.py \
            --config config/pipeline.yaml \
            --validate-only 2>&1 | tee /tmp/p08-bootstrap.log
      - uses: actions/upload-artifact@v4
        with:
          name: p08-bootstrap-log
          path: /tmp/p08-bootstrap.log
      - if: steps.validate.outcome == 'failure'
        run: exit 1
