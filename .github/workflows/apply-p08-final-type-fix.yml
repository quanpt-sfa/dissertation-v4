name: apply-p08-final-type-fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/p08-production-mcse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p08-production-mcse
          fetch-depth: 0
      - name: Consolidate coordinate validation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/p08c_aggregate_batches.py')
          text = path.read_text(encoding='utf-8')
          old = '''        raw_coordinates = item.get("coordinates")
              if not isinstance(raw_coordinates, dict):
                  raise ValueError("simulation batch manifest coordinates required")
              coordinates = {
                  str(key): str(value)
                  for key, value in cast(dict[object, object], raw_coordinates).items()
              }
          '''
          new = '''        coordinates = _coordinates(item)
          '''
          if old not in text:
              raise SystemExit('P08C coordinate block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit final type fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p08c_aggregate_batches.py
          git commit -m "Consolidate P08 artifact coordinate validation"
          git push origin HEAD:agent/p08-production-mcse
