name: apply-p08-final-type-fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/p08-production-mcse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p08-production-mcse
          fetch-depth: 0
      - name: Consolidate coordinate validation
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('scripts/p08c_aggregate_batches.py')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r'        raw_coordinates = item\.get\("coordinates"\)\n'
              r'        if not isinstance\(raw_coordinates, dict\):\n'
              r'            raise ValueError\("simulation batch manifest coordinates required"\)\n'
              r'        coordinates = \{\n'
              r'            str\(key\): str\(value\)\n'
              r'            for key, value in cast\(dict\[object, object\], raw_coordinates\)\.items\(\)\n'
              r'        \}\n',
              '        coordinates = _coordinates(item)\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('P08C coordinate block not found')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit final type fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p08c_aggregate_batches.py
          git commit -m "Consolidate P08 artifact coordinate validation"
          git push origin HEAD:agent/p08-production-mcse
