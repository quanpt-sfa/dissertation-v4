name: diagnose-p08-pytest

on:
  pull_request:

jobs:
  diagnose:
    if: github.head_ref == 'agent/p08-production-mcse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee /tmp/p08-pytest.log
      - uses: actions/upload-artifact@v4
        with:
          name: p08-pytest-log
          path: /tmp/p08-pytest.log
      - if: steps.tests.outcome == 'failure'
        run: exit 1
