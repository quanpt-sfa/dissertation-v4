name: format-p08-control-once

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/p08-production-mcse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p08-production-mcse
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: |
          uv run ruff format \
            scripts/p08_profiled_orchestrator.py \
            src/simulation/mcse_control.py \
            tests/stages/test_p08_orchestrator_control.py
          uv run ruff check \
            scripts/p08_profiled_orchestrator.py \
            src/simulation/mcse_control.py \
            tests/stages/test_p08_orchestrator_control.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/p08_profiled_orchestrator.py \
            src/simulation/mcse_control.py \
            tests/stages/test_p08_orchestrator_control.py
          git commit -m "Format P08 confirmatory control implementation"
          git push origin HEAD:agent/p08-production-mcse
