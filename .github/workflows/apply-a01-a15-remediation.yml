name: Apply A01-A15 remediation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remediate-a01-a15-audit
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fix source-pattern violations
        run: |
          python - <<'PY'
          from pathlib import Path

          features = Path('src/features/service.py')
          text = features.read_text(encoding='utf-8')
          text = text.replace(
              '{"eligible", "eligible_observability_view", "blocked_until_mapping_review"}',
              '{ELIGIBLE, "eligible_observability_view", "blocked_until_mapping_review"}',
          )
          text = text.replace(
              'frozenset({"eligible", "eligible_observability_view"})',
              'frozenset({ELIGIBLE, "eligible_observability_view"})',
          )
          features.write_text(text, encoding='utf-8')

          validation = Path('src/core/config_validation.py')
          text = validation.read_text(encoding='utf-8')
          text = text.replace(
              'prediction_time = _entry(study.get("prediction_time"), "study.prediction_time")',
              'prediction_anchor_config = _entry(\n'
              '        study.get(PREDICTION_TIME), "study.prediction_time"\n'
              '    )',
          )
          text = text.replace('prediction_time.get(', 'prediction_anchor_config.get(')
          text = text.replace(
              'from .semantic_keys import CHANNEL_ID',
              'from .semantic_keys import CHANNEL_ID, PREDICTION_TIME',
          )
          validation.write_text(text, encoding='utf-8')

          Path('scripts/apply_a01_a15_remediation.py').unlink(missing_ok=True)
          Path('scripts/apply_a01_a15_followup.py').unlink(missing_ok=True)
          PY
      - name: Validate registry
        run: |
          uv sync --all-extras
          mkdir -p artifacts/a01-a15
          set +e
          uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --validate-only > artifacts/a01-a15/validation.log 2>&1
          echo "exit_code=$?" >> artifacts/a01-a15/validation.log
          set -e
      - uses: actions/upload-artifact@v4
        with:
          name: a01-a15-validation
          path: artifacts/a01-a15/validation.log
          if-no-files-found: error
      - name: Commit source-pattern fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix audit remediation source-pattern violations' || exit 0
          git push origin HEAD:agent/remediate-a01-a15-audit
