name: Apply A01-A15 remediation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remediate-a01-a15-audit
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture registry validation
        run: |
          uv sync --all-extras
          mkdir -p artifacts/a01-a15
          set +e
          uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --validate-only > artifacts/a01-a15/validation.log 2>&1
          echo "exit_code=$?" >> artifacts/a01-a15/validation.log
          set -e
      - uses: actions/upload-artifact@v4
        with:
          name: a01-a15-validation
          path: artifacts/a01-a15/validation.log
          if-no-files-found: error
