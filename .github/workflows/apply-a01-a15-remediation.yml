name: Apply A01-A15 remediation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remediate-a01-a15-audit
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install environment
        run: uv sync --all-extras
      - name: Apply idempotent remediation
        run: |
          python scripts/apply_a01_a15_remediation.py
          python scripts/apply_a01_a15_followup.py
      - name: Generate registry documents
        continue-on-error: true
        run: uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --write
      - name: Format Python
        continue-on-error: true
        run: uv run ruff format .
      - name: Autofix lint
        continue-on-error: true
        run: uv run ruff check --fix .
      - name: Commit normalized remediation
        run: |
          if git diff --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize methodological audit remediation'
          git push origin HEAD:agent/remediate-a01-a15-audit
