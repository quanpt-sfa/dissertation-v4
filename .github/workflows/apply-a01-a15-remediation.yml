name: Apply A01-A15 remediation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remediate-a01-a15-audit
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture registry validation
        run: |
          uv sync --all-extras
          mkdir -p .github/diagnostics
          set +e
          uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --validate-only > .github/diagnostics/a01_a15_validation.log 2>&1
          echo "exit_code=$?" >> .github/diagnostics/a01_a15_validation.log
          set -e
      - name: Commit validation diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/diagnostics/a01_a15_validation.log
          git commit -m 'Capture audit remediation validation diagnostics' || exit 0
          git push origin HEAD:agent/remediate-a01-a15-audit
