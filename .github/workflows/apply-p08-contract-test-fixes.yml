name: apply-p08-contract-test-fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/p08-production-mcse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p08-production-mcse
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run python .github/scripts/apply_p08_contract_test_fixes.py
      - name: Correct temporary YAML insertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('config/execution/simulation_mcse.yaml')
          text = path.read_text(encoding='utf-8')
          bad = '''- policy_id: descriptive_imbalance_treatment_applied
  priority: 20
  metric_pattern: imbalance_treatment_applied
  role: descriptive
  mcse_gate_required: false
  undefined_policy: report_only
  target_rule: none
  minimum_finite_fraction: 0.0
'''
          good = '''  - policy_id: descriptive_imbalance_treatment_applied
    priority: 20
    metric_pattern: imbalance_treatment_applied
    role: descriptive
    mcse_gate_required: false
    undefined_policy: report_only
    target_rule: none
    minimum_finite_fraction: 0.0
'''
          if bad not in text:
              raise SystemExit('Temporary P08 policy block not found')
          path.write_text(text.replace(bad, good, 1), encoding='utf-8')
          PY
      - run: |
          uv run ruff check --fix \
            src/simulation/mcse_service.py \
            scripts/p08c_aggregate_batches.py || true
          uv run ruff format \
            src/simulation/mcse_service.py \
            scripts/p08c_aggregate_batches.py
      - id: targeted
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q \
            tests/stages/test_p08_mcse_contract.py::test_production_policy_registry_covers_every_registered_p08_metric \
            tests/stages/test_remaining_stage_invariants.py::test_p08c_exit_code_policies \
            tests/stages/test_remaining_stage_invariants.py::test_p08c_bijection_check_missing_diagnostics_fails \
            2>&1 | tee /tmp/p08-targeted.log
      - uses: actions/upload-artifact@v4
        with:
          name: p08-targeted-log
          path: /tmp/p08-targeted.log
      - if: steps.targeted.outcome == 'failure'
        run: exit 1
      - name: Commit contract fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/execution/simulation_mcse.yaml \
            src/simulation/mcse_service.py \
            scripts/p08c_aggregate_batches.py
          git commit -m "Complete P08 metric coverage and preserve stage invariants"
          git push origin HEAD:agent/p08-production-mcse
