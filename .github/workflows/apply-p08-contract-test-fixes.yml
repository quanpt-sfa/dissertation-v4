name: apply-p08-contract-test-fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/p08-production-mcse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p08-production-mcse
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Apply policy coverage and compatibility fixes
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          config = Path('config/execution/simulation_mcse.yaml')
          text = config.read_text(encoding='utf-8')
          marker = '''  - policy_id: descriptive_training_and_sampling
          '''
          policy = '''  - policy_id: descriptive_imbalance_treatment_applied
              priority: 20
              metric_pattern: imbalance_treatment_applied
              role: descriptive
              mcse_gate_required: false
              undefined_policy: report_only
              target_rule: none
              minimum_finite_fraction: 0.0
          '''
          if policy not in text:
              if marker not in text:
                  raise SystemExit('P08 descriptive policy insertion point not found')
              text = text.replace(marker, policy + marker, 1)
          config.write_text(text, encoding='utf-8')

          service = Path('src/simulation/mcse_service.py')
          text = service.read_text(encoding='utf-8')
          text = text.replace(
              '    required = {SCENARIO_ID, METHOD_ID, REPLICATION_ID, METRIC_ID, ESTIMATE}\n',
              '    required = {SCENARIO_ID, METHOD_ID, REPLICATION_ID, METRIC_ID}\n',
              1,
          )
          text = text.replace(
              '    records = cast(list[dict[str, object]], frame.to_dict(orient="records"))\n',
              '    records = cast(list[dict[str, object]], frame.to_dict(orient="records"))\n    estimate_present = ESTIMATE in frame.columns\n',
              1,
          )
          anchor = '    for row_index, group_key in normalized_rows:\n'
          replacement = '''    if not normalized_rows:
              return frame.copy()
              if not estimate_present:
                  raise ValueError("normalized cost regret rows require the estimate column")

              for row_index, group_key in normalized_rows:
          '''
          if replacement not in text:
              if anchor not in text:
                  raise SystemExit('P08 sanitizer normalized-row loop not found')
              text = text.replace(anchor, replacement, 1)
          service.write_text(text, encoding='utf-8')

          script = Path('scripts/p08c_aggregate_batches.py')
          text = script.read_text(encoding='utf-8')
          text = text.replace(
              'from simulation.mcse_contract import compile_metric_policies, resolve_metric_policies\n',
              'from simulation.mcse_contract import (\n    MetricPolicy,\n    compile_metric_policies,\n    resolve_metric_policies,\n)\n',
              1,
          )
          alias_marker = 'from simulation.replication_contract import replication_plan\n\n'
          if '_filter_active_batches = filter_active_batches' not in text:
              text = text.replace(
                  alias_marker,
                  alias_marker + '_filter_active_batches = filter_active_batches\n\n',
                  1,
              )
          text = text.replace(
              '''        clean = sanitize_normalized_cost_regret(value)
                  batches.append(clean)
          ''',
              '''        batches.append(value)
          ''',
              1,
          )
          mismatch_end = '''        )

              methodology = validate_methodology(
          '''
          mismatch_replacement = '''        )

              batches = [sanitize_normalized_cost_regret(batch) for batch in batches]

              methodology = _validate_methodology(
          '''
          if mismatch_end not in text:
              raise SystemExit('P08 methodology insertion point not found')
          text = text.replace(mismatch_end, mismatch_replacement, 1)
          text = text.replace(
              '''        scenario_by_id=scenario_by_id,
              )
              active_batches = filter_active_batches(batches, scenario_by_id)
          ''',
              '''        scenario_by_id=scenario_by_id,
                  simulation=simulation,
                  mcse_registry=mapping(loaded.registry.get("simulation_mcse"), "simulation_mcse"),
              )
              active_batches = _filter_active_batches(batches, scenario_by_id)
              methodology_report = {
                  key: value for key, value in methodology.items() if key != "metric_policies"
              }
          ''',
              1,
          )
          text = text.replace(
              '"methodology_validation": methodology,',
              '"methodology_validation": methodology_report,',
          )
          text, count = re.subn(
              r'\n    try:\n        mcse_registry = mapping\(loaded\.registry\.get\("simulation_mcse"\), "simulation_mcse"\)\n'
              r'        compiled_policies = compile_metric_policies\(mcse_registry, simulation\)\n'
              r'        policy_coverage = resolve_metric_policies\(\n'
              r'            required_active_metric_ids\(scenario_by_id\),\n'
              r'            compiled_policies,\n'
              r'        \)\n'
              r'    except ValueError as exc:\n'
              r'        return _finish\([\s\S]*?            failure_code=2,\n'
              r'        \)\n',
              '\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('P08 standalone policy block not found')
          core_marker = '    core = mapping(simulation.get("core"), "simulation.core")\n'
          policy_binding = '''    metric_policies_raw = methodology.get("metric_policies")
              metric_policies = (
                  cast(dict[str, MetricPolicy], metric_policies_raw)
                  if isinstance(metric_policies_raw, dict)
                  else {}
              )

          '''
          if policy_binding not in text:
              text = text.replace(core_marker, policy_binding + core_marker, 1)
          text = text.replace(
              '        metric_policies=policy_coverage["policies"],\n',
              '        metric_policies=metric_policies,\n',
              1,
          )
          text = re.sub(
              r'            "metric_policy_coverage": \{\n'
              r'                key: value for key, value in policy_coverage\.items\(\) if key != "policies"\n'
              r'            \},\n',
              '            "metric_policy_coverage": methodology.get("metric_policy_coverage", {}),\n',
              text,
              count=1,
          )
          helper_marker = '\ndef _coordinates(item: dict[str, object]) -> dict[str, str]:\n'
          helper = '''
def _validate_methodology(
              *,
              batches: list[pd.DataFrame],
              scenario_by_id: dict[str, dict[str, object]],
              simulation: dict[str, object],
              mcse_registry: dict[str, object],
          ) -> dict[str, object]:
              result = validate_methodology(batches=batches, scenario_by_id=scenario_by_id)
              if result.get("status") != "PASS":
                  return result
              try:
                  compiled = compile_metric_policies(mcse_registry, simulation)
                  coverage = resolve_metric_policies(
                      required_active_metric_ids(scenario_by_id),
                      compiled,
                  )
              except ValueError as exc:
                  reason_codes_raw = result.get("reason_codes")
                  reason_codes = (
                      [str(value) for value in reason_codes_raw]
                      if isinstance(reason_codes_raw, list)
                      else []
                  )
                  return {
                      **result,
                      "status": "FAIL",
                      "reason_codes": [*reason_codes, "P08_MCSE_POLICY_CONTRACT_INCOMPLETE"],
                      "policy_error": str(exc),
                  }
              return {
                  **result,
                  "metric_policy_coverage": {
                      key: value for key, value in coverage.items() if key != "policies"
                  },
                  "metric_policies": coverage["policies"],
              }

          '''
          if 'def _validate_methodology(' not in text:
              if helper_marker not in text:
                  raise SystemExit('P08 helper insertion point not found')
              text = text.replace(helper_marker, helper + helper_marker, 1)
          script.write_text(text, encoding='utf-8')
          PY
          FILES=(
            config/execution/simulation_mcse.yaml
            src/simulation/mcse_service.py
            scripts/p08c_aggregate_batches.py
          )
          uv run ruff check --fix src/simulation/mcse_service.py scripts/p08c_aggregate_batches.py || true
          uv run ruff format src/simulation/mcse_service.py scripts/p08c_aggregate_batches.py
          uv run pytest -q \
            tests/stages/test_p08_mcse_contract.py::test_production_policy_registry_covers_every_registered_p08_metric \
            tests/stages/test_remaining_stage_invariants.py::test_p08c_exit_code_policies \
            tests/stages/test_remaining_stage_invariants.py::test_p08c_bijection_check_missing_diagnostics_fails
      - name: Commit contract fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/execution/simulation_mcse.yaml \
            src/simulation/mcse_service.py \
            scripts/p08c_aggregate_batches.py
          git commit -m "Complete P08 metric coverage and preserve stage invariants"
          git push origin HEAD:agent/p08-production-mcse
