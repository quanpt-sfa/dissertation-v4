name: format-p12-preview

on:
  push:
    branches:
      - fix/p07-raw-computation-report-contract

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p07-raw-computation-report-contract
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run ruff format src/core/resume.py tests/runtime/test_p12_compatible_resume.py
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- src/core/resume.py tests/runtime/test_p12_compatible_resume.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/resume.py tests/runtime/test_p12_compatible_resume.py
          git commit -m "style: apply canonical P12 formatting"
          git push origin HEAD:fix/p07-raw-computation-report-contract
