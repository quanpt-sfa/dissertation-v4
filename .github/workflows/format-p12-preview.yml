name: format-p12-preview

on:
  push:
    branches:
      - fix/p07-raw-computation-report-contract
  pull_request:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run ruff format src/core/resume.py tests/runtime/test_p12_compatible_resume.py
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-p12-resume
          path: |
            src/core/resume.py
            tests/runtime/test_p12_compatible_resume.py
