name: agent-ruff-format-preview

on:
  push:
    branches:
      - agent/l3-pii-p08-architecture

permissions:
  contents: write

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/l3-pii-p08-architecture
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Apply Ruff formatting
        run: |
          uv run ruff format src/simulation/l3_variants.py tests/test_l3_variants.py tests/stages/test_p08_mcse_contract.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/l3_variants.py tests/test_l3_variants.py tests/stages/test_p08_mcse_contract.py
          git commit -m "Apply Ruff formatting"
          git push origin HEAD:agent/l3-pii-p08-architecture
