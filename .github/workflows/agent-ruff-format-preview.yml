name: agent-ruff-format-preview

on:
  push:
    branches:
      - agent/l3-pii-p08-architecture

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Format changed Python files
        run: |
          uv run ruff format src/simulation/l3_variants.py tests/test_l3_variants.py tests/stages/test_p08_mcse_contract.py
          git diff --binary > ruff-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-format-patch
          path: ruff-format.patch
