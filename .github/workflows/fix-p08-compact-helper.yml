name: Fix P08 compact range helper

on:
  push:
    branches:
      - fix/p08-mcse-dissertation-budget

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[compact-helper-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p08-mcse-dissertation-budget
          fetch-depth: 0

      - name: Insert compact range helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/p08c_aggregate_batches.py')
          text = path.read_text(encoding='utf-8')
          helper = '''def _validate_replication_artifact_ranges(
              records: list[dict[str, object]],
          ) -> None:
              """Validate artifact ordinals independently of worker-batch compaction."""
              grouped: dict[tuple[str, str], list[dict[str, object]]] = {}
              for record in records:
                  key = (
                      str(record[SCENARIO_ID]),
                      str(record[METHOD_ID]),
                  )
                  grouped.setdefault(key, []).append(record)

              for (scenario_id, method_id), items in sorted(grouped.items()):
                  ordered = sorted(items, key=lambda item: int(item["start"]))
                  expected_start = 0
                  for artifact_index, item in enumerate(ordered):
                      start = int(item["start"])
                      end = int(item["end"])
                      replications = int(item["replications"])
                      batch_key = str(item[BATCH_KEY])
                      expected_batch_key = f"b{artifact_index:04d}"

                      if batch_key != expected_batch_key:
                          raise ValueError(
                              f"scenario={scenario_id}, method={method_id}: "
                              f"artifact range={start}-{end} has batch_key={batch_key}; "
                              f"expected compact-artifact ordinal={expected_batch_key}"
                          )
                      if start != expected_start:
                          raise ValueError(
                              f"scenario={scenario_id}, method={method_id}: "
                              f"replication artifact ranges are not contiguous; "
                              f"expected start={expected_start}, actual start={start}"
                          )
                      if end < start or end - start + 1 != replications:
                          raise ValueError(
                              f"scenario={scenario_id}, method={method_id}: "
                              "replication artifact range metadata is inconsistent"
                          )
                      expected_start = end + 1


          '''
          marker = 'def _sanitize_normalized_cost_regret(frame: pd.DataFrame) -> pd.DataFrame:\n'
          if 'def _validate_replication_artifact_ranges(' not in text:
              if marker not in text:
                  raise SystemExit('sanitizer marker not found')
              text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax check
        run: python -m compileall -q scripts/p08c_aggregate_batches.py tests/stages/test_p08_mcse_policy.py

      - name: Commit helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-p08-compact-helper.yml
          git add scripts/p08c_aggregate_batches.py
          git commit -m "fix(p08): add compact artifact range helper [compact-helper-applied]"
          git push origin HEAD:fix/p08-mcse-dissertation-budget
