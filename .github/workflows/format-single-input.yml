name: format-single-input

on:
  push:
    branches:
      - fix/p07-raw-computation-report-contract

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p07-raw-computation-report-contract
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run ruff format scripts/p03_evidence_ledger.py scripts/p03_final_evidence_ledger.py src/evidence/final_firm_year.py src/features/panel_source.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p03_evidence_ledger.py scripts/p03_final_evidence_ledger.py src/evidence/final_firm_year.py src/features/panel_source.py
          git commit -m "style: format single-input refactor"
          git push origin HEAD:fix/p07-raw-computation-report-contract
