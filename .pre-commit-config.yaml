repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: protocol-validate
        name: protocol validate
        entry: uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --validate-only
        language: system
        pass_filenames: false

      - id: generated-document-drift
        name: generated document drift
        entry: uv run python scripts/bootstrap_repository.py --config config/pipeline.yaml --check
        language: system
        pass_filenames: false

      - id: pyright-ratchet
        name: pyright ratchet
        entry: uv run python scripts/check_pyright_ratchet.py --baseline config/quality/pyright_baseline.json --staged
        language: system
        types: [python]
        pass_filenames: false

      - id: p0-tests
        name: focused P0 tests
        entry: uv run python -m pytest -q
        language: system
        pass_filenames: false
