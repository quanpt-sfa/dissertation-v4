
[project]
name = "chapter3-protocol-lock"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "pandas>=2.2",
  "pandera>=0.22",
  "pyarrow>=17",
  "openpyxl>=3.1",
  "scikit-learn>=1.5",
  "imbalanced-learn>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
  "pyright>=1.1",
  "pre-commit>=4",
  "pandas-stubs>=2.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "scripts", "tests"]

[dependency-groups]
dev = [
    "scikit-learn-stubs>=0.0.3",
]
